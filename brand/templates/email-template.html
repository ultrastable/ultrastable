<!-- Plain-text fallback: Subject line, greeting, short body, sign-off "Ultrastable", footer "ultrastable.io". -->
<!doctype html><html lang="en"><body style="margin:0;background:#F6F1E7;font-family:"IBM Plex Sans",system-ui,Arial,sans-serif;color:#14120F">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center" style="padding:24px 12px">
<table role="presentation" width="600" style="max-width:600px;background:#FFFFFF;border:1px solid #DDD5C5;border-radius:8px">
<tr><td style="padding:20px 28px;border-bottom:1px solid #DDD5C5"><img src="https://ultrastable.io/brand/ultrastable-primary.png" alt="ultrastable" height="32"></td></tr>
<tr><td style="padding:28px;font-size:16px;line-height:1.55">
<h1 style="margin:0 0 12px;font-size:26px;font-family:Fraunces,Georgia,serif">{{subject}}</h1>
<p style="margin:0 0 16px">{{body}}</p>
<p style="margin:24px 0"><a href="{{cta_url}}" style="background:#FF5B1F;color:#14120F;text-decoration:none;font-weight:600;padding:12px 20px;border-radius:6px;display:inline-block">{{cta_label}}</a></p>
<p style="margin:0">Ultrastable</p></td></tr>
<tr><td style="padding:16px 28px;border-top:1px solid #DDD5C5;font-size:13px;color:#5B574F">Ultrastable · Software that stays up · <a href="https://ultrastable.io" style="color:#FF5B1F">ultrastable.io</a></td></tr>
</table></td></tr></table></body></html>
