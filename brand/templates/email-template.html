<!-- Plain-text fallback: Subject line, greeting, short body, sign-off "Ultrastable", footer "ultrastable.io". -->
<!doctype html><html lang="en"><body style="margin:0;background:#F7F8FA;font-family:Inter,'Segoe UI',system-ui,Arial,sans-serif;color:#14181F">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center" style="padding:24px 12px">
<table role="presentation" width="600" style="max-width:600px;background:#FFFFFF;border:1px solid #D9DEE6;border-radius:14px">
<tr><td style="padding:20px 28px;border-bottom:1px solid #D9DEE6"><img src="https://ultrastable.io/brand/ultrastable-primary.png" alt="Ultrastable" height="32"></td></tr>
<tr><td style="padding:28px;font-size:16px;line-height:1.55">
<h1 style="margin:0 0 12px;font-size:22px">{{subject}}</h1>
<p style="margin:0 0 16px">{{body}}</p>
<p style="margin:24px 0"><a href="{{cta_url}}" style="background:#0B5FFF;color:#FFFFFF;text-decoration:none;font-weight:600;padding:12px 20px;border-radius:10px;display:inline-block">{{cta_label}}</a></p>
<p style="margin:0">Ultrastable</p></td></tr>
<tr><td style="padding:16px 28px;border-top:1px solid #D9DEE6;font-size:13px;color:#4A5360">Ultrastable · Software that stays up · <a href="https://ultrastable.io" style="color:#0B5FFF">ultrastable.io</a></td></tr>
</table></td></tr></table></body></html>
