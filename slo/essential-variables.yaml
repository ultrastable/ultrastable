  service: platform
  indicator:
    metadata:
      name: platform-owner-interventions-sli
    spec:
      thresholdMetric:
        metricSource:
          type: ultrastable
          spec:
            reading: owner.interventions_7d
            unit: owner-driven thread sessions in 7 days
  timeWindow:
  - duration: 1d
    isRolling: true
  budgetingMethod: Occurrences
  objectives:
  - displayName: at or above min
    op: gte
    value: 0
    target: 1.0
  - displayName: at or below max
    op: lte
    value: 0
    target: 1.0
---
