# generated by `python3 -m foundation openslo --apply` from doctrine/ultrastability.json; do not edit
apiVersion: openslo/v1
kind: SLO
metadata:
  name: platform-spend
  displayName: Spend against budget
spec:
  description: Past 1.0 the system costs more than its owner accepts, so it is no
    longer viable.
  service: platform
  indicator:
    metadata:
      name: platform-spend-sli
    spec:
      thresholdMetric:
        metricSource:
          type: ultrastable
          spec:
            reading: criticality.cost
            unit: of budget
  timeWindow:
  - duration: 1d
    isRolling: true
  budgetingMethod: Occurrences
  objectives:
  - displayName: at or above min
    op: gte
    value: 0
    target: 1.0
  - displayName: at or below max
    op: lte
    value: 1.0
    target: 1.0
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: platform-deploy-health
  displayName: Verified deploys
spec:
  description: A deploy whose live code differs from its commit means the loop that
    ships is not closing.
  service: platform
  indicator:
    metadata:
      name: platform-deploy-health-sli
    spec:
      thresholdMetric:
        metricSource:
          type: ultrastable
          spec:
            reading: criticality.verified_share
            unit: of deploys
  timeWindow:
  - duration: 1d
    isRolling: true
  budgetingMethod: Occurrences
  objectives:
  - displayName: at or above min
    op: gte
    value: 1.0
    target: 1.0
  - displayName: at or below max
    op: lte
    value: 1.0
    target: 1.0
---
