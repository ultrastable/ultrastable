metadata:
  name: platform-stalled-clocks
  displayName: Clocks that stopped
spec:
  description: A clock that stops halts the loop it drives; the system is viable only
    while every clock keeps ticking, and a watchdog that goes silent reads as unmeasured.
  service: platform
  indicator:
    metadata:
      name: platform-stalled-clocks-sli
    spec:
      thresholdMetric:
        metricSource:
          type: ultrastable
          spec:
            reading: resilience.stalled
            unit: clocks
  timeWindow:
  - duration: 1d
    isRolling: true
  budgetingMethod: Occurrences
  objectives:
  - displayName: at or above min
    op: gte
    value: 0
    target: 1.0
  - displayName: at or below max
    op: lte
    value: 0
    target: 1.0
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: platform-ui-findings
  displayName: Front-end findings that block a user
spec:
  description: A page that fails accessibility, leaks backend detail, breaks its structure
    or its brand is a front end drifting into a mishmash; the UI/UX loop (UIUX-1)
    must keep this at zero, and a variable that cannot be read from a fresh audit
    is unmeasured and so not in bounds.
  service: platform
  indicator:
    metadata:
      name: platform-ui-findings-sli
    spec:
      thresholdMetric:
        metricSource:
          type: ultrastable
          spec:
            reading: uiux.findings
            unit: findings
  timeWindow:
  - duration: 1d
    isRolling: true
  budgetingMethod: Occurrences
  objectives:
  - displayName: at or above min
    op: gte
    value: 0
    target: 1.0
  - displayName: at or below max
    op: lte
    value: 0
    target: 1.0
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: platform-happy-paths
  displayName: User paths that still walk end to end
spec:
  description: A path in doctrine/stakeholders.json that no longer clicks through
    is a user who cannot get from entry to the next step; every audience path must
    walk, and the UI/UX loop runs each as a browser flow.
  service: platform
  indicator:
    metadata:
      name: platform-happy-paths-sli
    spec:
      thresholdMetric:
        metricSource:
          type: ultrastable
          spec:
            reading: uiux.happy_paths
            unit: of paths
  timeWindow:
  - duration: 1d
    isRolling: true
  budgetingMethod: Occurrences
  objectives:
  - displayName: at or above min
    op: gte
    value: 1.0
    target: 1.0
  - displayName: at or below max
    op: lte
    value: 1.0
    target: 1.0
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: platform-unattended-horizon
  displayName: Unattended horizon
spec:
  description: A year with no person is the design target (UNATTENDED-365). foundation/yearsim.py
    injects a year of faults into the real recovery code; when the 10th percentile
    of simulated years ends before 365 days, something the system needs is not repairing
    itself.
  service: platform
  indicator:
    metadata:
      name: platform-unattended-horizon-sli
    spec:
      thresholdMetric:
        metricSource:
          type: ultrastable
          spec:
            reading: yearsim.horizon_p10
            unit: days (10th percentile of simulated years)
  timeWindow:
  - duration: 1d
    isRolling: true
  budgetingMethod: Occurrences
  objectives:
  - displayName: at or above min
    op: gte
    value: 365
    target: 1.0
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: platform-self-shipping
  displayName: Self-originated releases
spec:
  description: 'Rowan''s biggest goal: the server itself originates and ships substantive
    changes daily (SELF-REFERENCE-1). Counted from git by foundation/yearsim.py self_commits:
    executor or own-agent commits on main with at least 10 changed lines of code outside
    ledgers and generated data. A one-line import removal is upkeep, not a release
    (NO-TRIVIAL-COMMITS).'
  service: platform
  indicator:
    metadata:
      name: platform-self-shipping-sli
    spec:
      thresholdMetric:
        metricSource:
          type: ultrastable
          spec:
            reading: yearsim.self_rate
            unit: substantive server-originated changes a day (14-day mean, at least
              10 changed code lines each)
  timeWindow:
  - duration: 1d
    isRolling: true
  budgetingMethod: Occurrences
  objectives:
  - displayName: at or above min
    op: gte
    value: 1.0
    target: 1.0
---
apiVersion: openslo/v1
