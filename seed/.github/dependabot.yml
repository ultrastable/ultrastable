# DEP-LOOP-1 / STANDARDS-1: every dependency ecosystem a seeded system ships is advanced by Dependabot; the system's merge lane
# merges the change when its checks pass. The platform's tests/foundation/test_open_standards.py fails when an ecosystem is missing.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
    open-pull-requests-limit: 1
