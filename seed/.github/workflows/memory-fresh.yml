name: memory-fresh
# budget: ~1 min per ready PR
# trigger: PR only, docs paths
# free-alternative: `scripts/check_memory.py` in agent sessions; folded into checks
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["docs/**", "scripts/check_memory.py", ".github/workflows/memory-fresh.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: memory-fresh-${{ github.ref }}
  cancel-in-progress: true
jobs:
  memory-fresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: docs/PROJECT-MEMORY.md is current
        run: python3 scripts/check_memory.py
