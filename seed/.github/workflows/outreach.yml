name: outreach
# The funding and outreach loop. Weekly and on demand only (GitHub Actions minutes on private repos are limited; owner directive 2026-11-10).
# budget: ~1 min x 4/month
# trigger: weekly and dispatch only
# free-alternative: Cloudflare cron worker
# Minute budget: one job, about 1 minute per run, 4-5 runs a month = under 6 minutes a month. No push trigger, no second workflow.
# Prefer the Cloudflare cron worker for anything more frequent (docs/BOOTSTRAP-GAPS.md BG-34).
# Dry-run until outreach/gate.json mode=live AND sender.registered AND the OUTREACH_SEND_URL / OUTREACH_SEND_TOKEN secrets exist.
# Kill switch: outreach/gate.json "kill": true. The one list for a person is NEEDS-YOU.md. Status: outreach/STATUS.md.
# To record a reply from a phone: run this workflow with reply_key and reply_kind.
on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
    inputs:
      reply_key: {description: "Target key such as qniverse:R-NWO (optional)", required: false}
      reply_kind: {description: "ack, question, accepted, rejected, opt-out or bounce", required: false}
      reply_note: {description: "Short note (optional)", required: false}
permissions:
  contents: write
concurrency:
  group: outreach
  cancel-in-progress: true
jobs:
  loop:
    if: ${{ !github.event.repository.is_template && github.repository != 'ultrastable/seed' && vars.HALT != '1' }}  # HALT-1; TEMPLATE-CODE-ONLY-1: the template itself never runs a system's loops
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Record reply
        if: ${{ inputs.reply_key != '' && inputs.reply_kind != '' }}
        run: |
          # intro:<id> keys belong to the intro lane (OUTREACH-INTRO-1); every other key to the programme lane
          case "${{ inputs.reply_key }}" in
            intro:*) python3 scripts/outreach_intro.py reply "${{ inputs.reply_key }}" --kind "${{ inputs.reply_kind }}" --note "${{ inputs.reply_note }}" ;;
            *) python3 scripts/outreach.py reply "${{ inputs.reply_key }}" --kind "${{ inputs.reply_kind }}" --note "${{ inputs.reply_note }}" ;;
          esac
      - name: Run the loop
        env:
          OUTREACH_SEND_URL: ${{ secrets.OUTREACH_SEND_URL }}
          OUTREACH_SEND_TOKEN: ${{ secrets.OUTREACH_SEND_TOKEN }}
        run: |
          python3 scripts/outreach.py run
          python3 scripts/outreach_intro.py run
      - name: Build dashboard snapshot and post it when the secrets exist
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          FLEET_TOKEN: ${{ secrets.FLEET_TOKEN }}
        run: |
          python3 scripts/dashboard_snapshot.py
          if [ -z "$DASHBOARD_URL" ] || [ -z "$FLEET_TOKEN" ]; then echo "::notice::DASHBOARD_URL or FLEET_TOKEN not set: snapshot committed only (BG-33)"; exit 0; fi
          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST "$DASHBOARD_URL/api/fleet/snapshot" -H "authorization: Bearer $FLEET_TOKEN" -H 'content-type: application/json' --data-binary @dashboard/snapshot.json)
          [ "$code" = "200" ] || { echo "::error::dashboard answered HTTP $code"; exit 1; }
      - name: Summary
        run: cat outreach/STATUS.md >> "$GITHUB_STEP_SUMMARY"
      - name: Record state
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git add outreach dashboard/snapshot.json
          if git diff --cached --quiet; then echo "no state change"; exit 0; fi
          git config user.name "ultrastable-outreach"; git config user.email "outreach@ultrastable.io"
          git commit -m "outreach: record run state"
          git push origin HEAD:main || { echo "::error::state push failed; see docs/BOOTSTRAP-GAPS.md BG-25 and BG-29"; exit 1; }
