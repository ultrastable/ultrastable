name: bootstrap
# budget: ~2 min per push to main
# trigger: push to main and dispatch; the apply job only provisions when secrets exist
# free-alternative: run bootstrap.py from an agent session
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    if: ${{ !github.event.repository.is_template && github.repository != 'ultrastable/seed' && vars.HALT != '1' }}  # HALT-1; TEMPLATE-CODE-ONLY-1: the template itself never runs a system's loops
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: python3 -m unittest discover tests
      - run: python3 bootstrap/bootstrap.py --dry-run
      - run: cd worker && npm test
  apply:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Provisions only when the owner has set the secrets; otherwise the dry run above already opened gate cards.
    if: (!github.event.repository.is_template && github.repository != 'ultrastable/seed') && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') && vars.HALT != '1'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: python3 bootstrap/bootstrap.py --apply
      - name: Commit the org record
        run: |
          git config user.name "ultrastable-bootstrap"
          git config user.email "bootstrap@users.noreply.github.com"
          git add org && git diff --cached --quiet || git commit -m "Record boot: org/ charter, roles, backlog, gate cards" && git push
