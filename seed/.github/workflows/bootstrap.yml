name: bootstrap
# budget: ~2 min per push to main and per idea; the daily retry exits in seconds once the system is live (~30 min per month at most while it is not)
# trigger: push to main, the owner's idea arriving through the Start my system form, and once a day until the system is live (never faster than daily)
# free-alternative: run bootstrap.py from a cloud-hosted agent session
# CLONE-PATH-1: the person who copied the template types an idea into a form and does nothing else. This workflow writes IDEA.md from their
# words, plans, tests and deploys the system on GitHub's built-in credential, tries again by itself, and tells them in plain words what happened.
on:
  push:
    branches: [main]
  issues:
    types: [opened, edited]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: bootstrap
  cancel-in-progress: false
jobs:
  boot:
    # HALT-1; TEMPLATE-CODE-ONLY-1: the template itself never runs a system's loops. An issue starts a boot only when it is the idea form.
    if: ${{ vars.HALT != '1' && !github.event.repository.is_template && github.repository != 'ultrastable/seed' && (github.event_name != 'issues' || startsWith(github.event.issue.title, 'My idea')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Is there anything left to start?
        id: need
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && ! python3 bootstrap/intake.py --root . --needs-run; then echo "run=0" >> "$GITHUB_OUTPUT"; else echo "run=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v7
        if: steps.need.outputs.run == '1'
        with: { node-version: 24 }
      - name: Take the idea from the form
        if: steps.need.outputs.run == '1' && github.event_name == 'issues'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_ASSOCIATION: ${{ github.event.issue.author_association }}
        run: python3 bootstrap/intake.py --root . --from-env
      - name: Test the kernel
        if: steps.need.outputs.run == '1' && github.event_name == 'push'
        run: |
          python3 -m unittest discover tests
          cd worker && npm test
      - name: Plan, deploy and probe
        if: steps.need.outputs.run == '1'
        run: python3 bootstrap/bootstrap.py --apply --real
      - name: Commit the idea and the org record
        if: always() && steps.need.outputs.run == '1'
        run: |
          git config user.name "ultrastable-bootstrap"
          git config user.email "bootstrap@users.noreply.github.com"
          git add IDEA.md org
          # IDENTITY-AT-BIRTH-1: the identity the boot adopted (scripts/surfaces.py adopt) is the system's own; it is kept, not lost with the runner
          for f in ultrastable.json README.md CITATION.cff publiccode.yml catalog-info.yaml llms.txt REUSE.toml LICENSES codemeta.json CHANGELOG.md CONTRIBUTING.md SECURITY.md .ultrastable; do
            if [ -e "$f" ]; then git add -- "$f"; fi
          done
          git diff --cached --quiet || { git commit -m "bootstrap: record boot (the idea, org/ charter, roles, backlog, gate cards)"; git push; }
      - name: Tell the owner in plain words
        if: always() && steps.need.outputs.run == '1'
        run: python3 bootstrap/intake.py --root . --tell
