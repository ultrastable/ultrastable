name: autonomy
# budget: ~2 min per run, about 5 runs a month, free on a public repository
# trigger: weekly, because the year simulation only changes when this system's code changes; a push to main that touches worker, scripts or autonomy re-runs it at once
# free-alternative: the Cloudflare cron worker runs the same two commands, or a cloud-hosted agent session
# SEED-ADMIT-1: installed by the generator from the core kit (seed/autonomy-kit/autonomy.workflow.yml); never hand-edited, regenerated by `python3 scripts/seedadmit.py --wire`.
on:
  schedule: [{cron: "17 5 * * 2"}]
  push:
    branches: [main]
    paths: ["worker/**", "scripts/**", "autonomy/**"]
  workflow_dispatch: {}
permissions: {contents: write}
concurrency: {group: autonomy, cancel-in-progress: false}
jobs:
  readmit:
    if: ${{ vars.HALT != '1' && !github.event.repository.is_template && github.repository != 'ultrastable/seed' }}  # HALT-1 and TEMPLATE-CODE-ONLY-1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Year simulation on this system's own recovery code; admission re-issued (SEED-ADMIT-1)
        id: admit
        run: python3 scripts/seedadmit.py --admit --apply
        continue-on-error: true  # a held verdict is data: it is committed below and the system files its own repair item
      - name: Temporal drift read (TRAJECTORY-1)
        run: python3 scripts/trajectory.py --run --apply
        continue-on-error: true
      - name: Land evidence on main with the built-in token
        run: |
          git config user.name "ultrastable-autonomy"
          git config user.email "actions@users.noreply.github.com"
          git add ops
          git diff --cached --quiet || { git commit -m "autonomy: admission and trajectory evidence [skip ci]" && git pull --rebase origin main && git push origin HEAD:main; }
      - name: A held verdict fails the run so the clock shows it
        if: steps.admit.outcome == 'failure'
        run: exit 1
