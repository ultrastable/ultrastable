<svg xmlns="http://www.w3.org/2000/svg" width="840" height="640" viewBox="0 0 840 640" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="black"/></marker></defs>
<text x="420.0" y="28" text-anchor="middle" font-size="18" font-weight="bold">FIG. 10  Work claims with expiry and fencing token</text>
<rect x="215.0" y="51.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="330" y="76.5" text-anchor="middle" font-size="12.5">Agent requests claim on component</text>
<text x="330" y="91.5" text-anchor="middle" font-size="12.5">(path, intent, holder)</text>
<text x="449.0" y="63.0" font-size="12" font-weight="bold">1002</text>
<polygon points="330,134 475,180 330,226 185,180" fill="white" stroke="black" stroke-width="1.6"/>
<text x="330" y="176.5" text-anchor="middle" font-size="12.5">Live unexpired claim held</text>
<text x="330" y="191.5" text-anchor="middle" font-size="12.5">by another agent?</text>
<text x="479" y="150" font-size="12" font-weight="bold">1004</text>
<rect x="505.0" y="151.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="620" y="176.5" text-anchor="middle" font-size="12.5">Do not duplicate: review the</text>
<text x="620" y="191.5" text-anchor="middle" font-size="12.5">claimed change or take next item</text>
<text x="739.0" y="163.0" font-size="12" font-weight="bold">1006</text>
<rect x="215.0" y="261.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="330" y="286.5" text-anchor="middle" font-size="12.5">Grant claim: token, expiry,</text>
<text x="330" y="301.5" text-anchor="middle" font-size="12.5">fence = previous fence + 1</text>
<text x="449.0" y="273.0" font-size="12" font-weight="bold">1008</text>
<rect x="215.0" y="351.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="330" y="376.5" text-anchor="middle" font-size="12.5">Write to component presenting</text>
<text x="330" y="391.5" text-anchor="middle" font-size="12.5">token and fence; renew by heartbeat</text>
<text x="449.0" y="363.0" font-size="12" font-weight="bold">1010</text>
<polygon points="330,434 475,480 330,526 185,480" fill="white" stroke="black" stroke-width="1.6"/>
<text x="330" y="476.5" text-anchor="middle" font-size="12.5">Resource accepts write only for</text>
<text x="330" y="491.5" text-anchor="middle" font-size="12.5">live token and current fence?</text>
<text x="479" y="450" font-size="12" font-weight="bold">1012</text>
<rect x="505.0" y="451.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="620" y="484.0" text-anchor="middle" font-size="12.5">Reject stale write</text>
<text x="739.0" y="463.0" font-size="12" font-weight="bold">1014</text>
<rect x="215.0" y="561.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="330" y="586.5" text-anchor="middle" font-size="12.5">Release with outcome; reaper</text>
<text x="330" y="601.5" text-anchor="middle" font-size="12.5">releases expired claims</text>
<text x="449.0" y="573.0" font-size="12" font-weight="bold">1016</text>
<line x1="330" y1="109" x2="330" y2="134" stroke="black" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="475" y1="180" x2="505" y2="180" stroke="black" stroke-width="1.4" marker-end="url(#a)"/>
<text x="496.0" y="176.0" font-size="11.5" font-style="italic">yes</text>
<line x1="330" y1="226" x2="330" y2="261" stroke="black" stroke-width="1.4" marker-end="url(#a)"/>
<text x="336.0" y="239.5" font-size="11.5" font-style="italic">no</text>
<line x1="330" y1="319" x2="330" y2="351" stroke="black" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="330" y1="409" x2="330" y2="434" stroke="black" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="475" y1="480" x2="505" y2="480" stroke="black" stroke-width="1.4" marker-end="url(#a)"/>
<text x="496.0" y="476.0" font-size="11.5" font-style="italic">no</text>
<line x1="330" y1="526" x2="330" y2="561" stroke="black" stroke-width="1.4" marker-end="url(#a)"/>
<text x="336.0" y="539.5" font-size="11.5" font-style="italic">yes</text>
</svg>