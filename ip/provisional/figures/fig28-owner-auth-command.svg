<svg xmlns="http://www.w3.org/2000/svg" width="960" height="740" viewBox="0 0 960 740" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="black"/></marker></defs>
<text x="480.0" y="28" text-anchor="middle" font-size="18" font-weight="bold">FIG. 28  Emailed-code login, session, step-up and command execution</text>
<rect x="125.0" y="71.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="240" y="96.5" text-anchor="middle" font-size="12.5">Owner types login or taps</text>
<text x="240" y="111.5" text-anchor="middle" font-size="12.5">&quot;Email me a code&quot;</text>
<text x="359.0" y="83.0" font-size="12" font-weight="bold">2802</text>
<rect x="125.0" y="186.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="240" y="211.5" text-anchor="middle" font-size="12.5">Rate check; 6-digit code; hash stored;</text>
<text x="240" y="226.5" text-anchor="middle" font-size="12.5">emailed only to preset address</text>
<text x="359.0" y="198.0" font-size="12" font-weight="bold">2804</text>
<rect x="125.0" y="301.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="240" y="326.5" text-anchor="middle" font-size="12.5">Owner submits code; hash compared,</text>
<text x="240" y="341.5" text-anchor="middle" font-size="12.5">limited tries, 10 minute lifetime</text>
<text x="359.0" y="313.0" font-size="12" font-weight="bold">2806</text>
<rect x="125.0" y="416.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="240" y="441.5" text-anchor="middle" font-size="12.5">Random token stored as hash;</text>
<text x="240" y="456.5" text-anchor="middle" font-size="12.5">cookie set, 12 hour session</text>
<text x="359.0" y="428.0" font-size="12" font-weight="bold">2808</text>
<rect x="605.0" y="71.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="720" y="96.5" text-anchor="middle" font-size="12.5">Command typed or button tapped</text>
<text x="720" y="111.5" text-anchor="middle" font-size="12.5">(same registry, same path)</text>
<text x="839.0" y="83.0" font-size="12" font-weight="bold">2810</text>
<polygon points="720,184 865,230 720,276 575,230" fill="white" stroke="black" stroke-width="1.6"/>
<text x="720" y="226.5" text-anchor="middle" font-size="12.5">Owner session</text>
<text x="720" y="241.5" text-anchor="middle" font-size="12.5">present?</text>
<text x="869" y="200" font-size="12" font-weight="bold">2812</text>
<polygon points="720,324 865,370 720,416 575,370" fill="white" stroke="black" stroke-width="1.6"/>
<text x="720" y="366.5" text-anchor="middle" font-size="12.5">Destructive and last code</text>
<text x="720" y="381.5" text-anchor="middle" font-size="12.5">older than 15 minutes?</text>
<text x="869" y="340" font-size="12" font-weight="bold">2814</text>
<rect x="605.0" y="471.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="720" y="496.5" text-anchor="middle" font-size="12.5">Registry verb runs;</text>
<text x="720" y="511.5" text-anchor="middle" font-size="12.5">no arbitrary shell</text>
<text x="839.0" y="483.0" font-size="12" font-weight="bold">2816</text>
<rect x="605.0" y="581.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="720" y="606.5" text-anchor="middle" font-size="12.5">Log row with credential;</text>
<text x="720" y="621.5" text-anchor="middle" font-size="12.5">undo recorded where possible</text>
<text x="839.0" y="593.0" font-size="12" font-weight="bold">2818</text>
<rect x="125.0" y="651.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="240" y="676.5" text-anchor="middle" font-size="12.5">Refuse: need code or</text>
<text x="240" y="691.5" text-anchor="middle" font-size="12.5">loop token cannot act</text>
<text x="359.0" y="663.0" font-size="12" font-weight="bold">2820</text>
<rect x="125.0" y="531.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="240" y="556.5" text-anchor="middle" font-size="12.5">Prompt for fresh code</text>
<text x="240" y="571.5" text-anchor="middle" font-size="12.5">in place; repeat tap</text>
<text x="359.0" y="543.0" font-size="12" font-weight="bold">2822</text>
