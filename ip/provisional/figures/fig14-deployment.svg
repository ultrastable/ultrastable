<text x="450" y="406.5" text-anchor="middle" font-size="12.5">Executor adapters: open models, hosted</text>
<text x="450" y="421.5" text-anchor="middle" font-size="12.5">coding agents, interactive sessions, people</text>
<text x="714.0" y="393.0" font-size="12" font-weight="bold">1412</text>
<rect x="190.0" y="481.0" width="520" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="450" y="506.5" text-anchor="middle" font-size="12.5">Managed systems as surfaces with probes</text>
<text x="450" y="521.5" text-anchor="middle" font-size="12.5">(repositories, services, channels, processes)</text>
<text x="714.0" y="493.0" font-size="12" font-weight="bold">1414</text>
