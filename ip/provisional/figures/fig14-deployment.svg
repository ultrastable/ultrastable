<text x="460.0" y="28" text-anchor="middle" font-size="18" font-weight="bold">FIG. 14  Deployment embodiments</text>
<rect x="190.0" y="51.0" width="520" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="450" y="76.5" text-anchor="middle" font-size="12.5">Organization-independent core</text>
<text x="450" y="91.5" text-anchor="middle" font-size="12.5">(persona, tick, ledger, gate, plus, trust modules)</text>
<text x="714.0" y="63.0" font-size="12" font-weight="bold">1402</text>
<rect x="85.0" y="171.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="200" y="196.5" text-anchor="middle" font-size="12.5">Edge embodiment: scheduled</text>
<text x="200" y="211.5" text-anchor="middle" font-size="12.5">serverless workers</text>
<text x="319.0" y="183.0" font-size="12" font-weight="bold">1404</text>
<rect x="585.0" y="171.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="700" y="196.5" text-anchor="middle" font-size="12.5">Portable embodiment: containers</text>
<text x="700" y="211.5" text-anchor="middle" font-size="12.5">with scheduled jobs</text>
<text x="819.0" y="183.0" font-size="12" font-weight="bold">1406</text>
<rect x="85.0" y="271.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="200" y="296.5" text-anchor="middle" font-size="12.5">Relational store (SQLite-class),</text>
<text x="200" y="311.5" text-anchor="middle" font-size="12.5">object store, key-value store</text>
<text x="319.0" y="283.0" font-size="12" font-weight="bold">1408</text>
<rect x="585.0" y="271.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="700" y="296.5" text-anchor="middle" font-size="12.5">Relational database, object</text>
<text x="700" y="311.5" text-anchor="middle" font-size="12.5">store, message queue</text>
<text x="819.0" y="283.0" font-size="12" font-weight="bold">1410</text>
