<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="840" viewBox="0 0 1120 840" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="black"/></marker></defs>
<text x="560.0" y="28" text-anchor="middle" font-size="18" font-weight="bold">FIG. 27  Platform-agnostic adapter mapping</text>
<rect x="300.0" y="56.0" width="520" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="560" y="81.5" text-anchor="middle" font-size="12.5">Portable core: schema, tick steps, ledgers, policy data,</text>
<text x="560" y="96.5" text-anchor="middle" font-size="12.5">protocol, probes (no platform calls)</text>
<text x="824.0" y="68.0" font-size="12" font-weight="bold">2702</text>
<rect x="300.0" y="156.0" width="520" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="560" y="181.5" text-anchor="middle" font-size="12.5">Adapter interface: six ports (schedule, store, secrets,</text>
<text x="560" y="196.5" text-anchor="middle" font-size="12.5">model, deploy, health) implemented once per platform</text>
<text x="824.0" y="168.0" font-size="12" font-weight="bold">2704</text>
<rect x="285.0" y="256.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="400" y="281.5" text-anchor="middle" font-size="12.5">Edge embodiment</text>
<text x="400" y="296.5" text-anchor="middle" font-size="12.5">(built, QNFO fleet)</text>
<text x="519.0" y="268.0" font-size="12" font-weight="bold">2706</text>
<rect x="565.0" y="256.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="680" y="281.5" text-anchor="middle" font-size="12.5">GCP embodiment</text>
<text x="680" y="296.5" text-anchor="middle" font-size="12.5">(prophetic)</text>
<text x="799.0" y="268.0" font-size="12" font-weight="bold">2708</text>
<rect x="845.0" y="256.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="960" y="281.5" text-anchor="middle" font-size="12.5">Container embodiment</text>
<text x="960" y="296.5" text-anchor="middle" font-size="12.5">(prophetic)</text>
<text x="1079.0" y="268.0" font-size="12" font-weight="bold">2710</text>
<rect x="15.0" y="346.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="130" y="379.0" text-anchor="middle" font-size="12.5">Schedule port</text>
<text x="249.0" y="358.0" font-size="12" font-weight="bold">2712</text>
<rect x="285.0" y="346.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="400" y="371.5" text-anchor="middle" font-size="12.5">Cron trigger runs a</text>
<text x="400" y="386.5" text-anchor="middle" font-size="12.5">scheduled worker</text>
<rect x="565.0" y="346.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="680" y="371.5" text-anchor="middle" font-size="12.5">Cloud Scheduler calls a</text>
<text x="680" y="386.5" text-anchor="middle" font-size="12.5">Cloud Run service or job</text>
<rect x="845.0" y="346.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="960" y="371.5" text-anchor="middle" font-size="12.5">Cron or CronJob calls</text>
<text x="960" y="386.5" text-anchor="middle" font-size="12.5">the container</text>
<rect x="15.0" y="426.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="130" y="459.0" text-anchor="middle" font-size="12.5">Store port</text>
<text x="249.0" y="438.0" font-size="12" font-weight="bold">2714</text>
<rect x="285.0" y="426.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="400" y="451.5" text-anchor="middle" font-size="12.5">Edge SQLite-class database</text>
<text x="400" y="466.5" text-anchor="middle" font-size="12.5">(D1), object store, KV</text>
<rect x="565.0" y="426.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="680" y="451.5" text-anchor="middle" font-size="12.5">Firestore or Cloud SQL,</text>
<text x="680" y="466.5" text-anchor="middle" font-size="12.5">Cloud Storage</text>
<rect x="845.0" y="426.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="960" y="451.5" text-anchor="middle" font-size="12.5">Relational database, object</text>
<text x="960" y="466.5" text-anchor="middle" font-size="12.5">store, message queue</text>
<rect x="15.0" y="506.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="130" y="539.0" text-anchor="middle" font-size="12.5">Secrets port</text>
<text x="249.0" y="518.0" font-size="12" font-weight="bold">2716</text>
<rect x="285.0" y="506.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="400" y="531.5" text-anchor="middle" font-size="12.5">Platform secret bindings</text>
<text x="400" y="546.5" text-anchor="middle" font-size="12.5">(presence only to tick)</text>
<rect x="565.0" y="506.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="680" y="531.5" text-anchor="middle" font-size="12.5">Secret Manager mounted</text>
<text x="680" y="546.5" text-anchor="middle" font-size="12.5">as env, presence only</text>
<rect x="845.0" y="506.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="960" y="531.5" text-anchor="middle" font-size="12.5">Orchestrator secrets as</text>
<text x="960" y="546.5" text-anchor="middle" font-size="12.5">environment variables</text>
<rect x="15.0" y="586.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="130" y="619.0" text-anchor="middle" font-size="12.5">Model port</text>
<text x="249.0" y="598.0" font-size="12" font-weight="bold">2718</text>
<rect x="285.0" y="586.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="400" y="611.5" text-anchor="middle" font-size="12.5">Edge inference plus</text>
<text x="400" y="626.5" text-anchor="middle" font-size="12.5">hosted model API</text>
<rect x="565.0" y="586.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="680" y="611.5" text-anchor="middle" font-size="12.5">Vertex AI endpoint plus</text>
<text x="680" y="626.5" text-anchor="middle" font-size="12.5">hosted model API</text>
<rect x="845.0" y="586.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="960" y="611.5" text-anchor="middle" font-size="12.5">Any inference endpoint,</text>
<text x="960" y="626.5" text-anchor="middle" font-size="12.5">local or remote</text>
<rect x="15.0" y="666.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="130" y="699.0" text-anchor="middle" font-size="12.5">Deploy port</text>
<text x="249.0" y="678.0" font-size="12" font-weight="bold">2720</text>
<rect x="285.0" y="666.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="400" y="691.5" text-anchor="middle" font-size="12.5">Versioned deploy, canary,</text>
<text x="400" y="706.5" text-anchor="middle" font-size="12.5">revert on probe failure</text>
<rect x="565.0" y="666.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="680" y="691.5" text-anchor="middle" font-size="12.5">Cloud Run revision, traffic</text>
<text x="680" y="706.5" text-anchor="middle" font-size="12.5">split, rollback on failure</text>
<rect x="845.0" y="666.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="960" y="691.5" text-anchor="middle" font-size="12.5">Image tag rollout and</text>
<text x="960" y="706.5" text-anchor="middle" font-size="12.5">rollback by the orchestrator</text>
<rect x="15.0" y="746.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="130" y="779.0" text-anchor="middle" font-size="12.5">Health port</text>
<text x="249.0" y="758.0" font-size="12" font-weight="bold">2722</text>
<rect x="285.0" y="746.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="400" y="779.0" text-anchor="middle" font-size="12.5">/health route on worker</text>
<rect x="565.0" y="746.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="680" y="771.5" text-anchor="middle" font-size="12.5">/health on Cloud Run plus</text>
<text x="680" y="786.5" text-anchor="middle" font-size="12.5">uptime check</text>
<rect x="845.0" y="746.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="960" y="771.5" text-anchor="middle" font-size="12.5">/health on container,</text>
<text x="960" y="786.5" text-anchor="middle" font-size="12.5">liveness probe</text>
