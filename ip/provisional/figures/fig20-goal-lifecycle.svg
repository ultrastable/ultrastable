<line x1="445" y1="380" x2="585" y2="380" stroke="black" stroke-width="1.4" marker-end="url(#a)"/>
<text x="521.0" y="376.0" font-size="11.5" font-style="italic">no</text>
<line x1="300" y1="426" x2="300" y2="444" stroke="black" stroke-width="1.4" marker-end="url(#a)"/>
<text x="306.0" y="431.0" font-size="11.5" font-style="italic">yes</text>
<line x1="300" y1="536" x2="300" y2="561" stroke="black" stroke-width="1.4" marker-end="url(#a)"/>
<text x="306.0" y="544.5" font-size="11.5" font-style="italic">yes</text>
<line x1="445" y1="490" x2="585" y2="490" stroke="black" stroke-width="1.4" marker-end="url(#a)"/>
<text x="521.0" y="486.0" font-size="11.5" font-style="italic">no</text>
<line x1="300" y1="619" x2="300" y2="651" stroke="black" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="300" y1="709" x2="300" y2="734" stroke="black" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="300" y1="826" x2="300" y2="861" stroke="black" stroke-width="1.4" marker-end="url(#a)"/>
<text x="306.0" y="839.5" font-size="11.5" font-style="italic">yes</text>
<path d="M445,780 L500,780 L500,680 L415,680" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#a)"/>
<text x="506" y="676" font-size="11.5" font-style="italic">no</text>
<line x1="700" y1="519" x2="700" y2="544" stroke="black" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="700" y1="636" x2="700" y2="671" stroke="black" stroke-width="1.4" marker-end="url(#a)"/>
<text x="706.0" y="649.5" font-size="11.5" font-style="italic">yes</text>
<path d="M555,590 L580,590 L580,890 L415,890" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#a)"/>
<text x="586" y="886" font-size="11.5" font-style="italic">no or overdue</text>
<path d="M815,270 L900,270 L900,590 L845,590" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#a)"/>
<text x="906" y="586" font-size="11.5" font-style="italic">ratified</text>
