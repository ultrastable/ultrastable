<svg xmlns="http://www.w3.org/2000/svg" width="980" height="950" viewBox="0 0 980 950" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="black"/></marker></defs>
<text x="490.0" y="28" text-anchor="middle" font-size="18" font-weight="bold">FIG. 20  Goal authoring and objective-space lifecycle</text>
<rect x="185.0" y="47.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="300" y="65.0" text-anchor="middle" font-size="12.5">Gather signals: proposals,</text>
<text x="300" y="80.0" text-anchor="middle" font-size="12.5">questions, score gaps, heal</text>
<text x="300" y="95.0" text-anchor="middle" font-size="12.5">actions, inferred direction</text>
<text x="419.0" y="59.0" font-size="12" font-weight="bold">2002</text>
<rect x="185.0" y="141.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="300" y="166.5" text-anchor="middle" font-size="12.5">Synthesize falsifiable candidate goals</text>
<text x="300" y="181.5" text-anchor="middle" font-size="12.5">with definition of done (model)</text>
<text x="419.0" y="153.0" font-size="12" font-weight="bold">2004</text>
<polygon points="300,224 445,270 300,316 155,270" fill="white" stroke="black" stroke-width="1.6"/>
<text x="300" y="266.5" text-anchor="middle" font-size="12.5">Would change the</text>
<text x="300" y="281.5" text-anchor="middle" font-size="12.5">objective itself?</text>
<text x="449" y="240" font-size="12" font-weight="bold">2006</text>
<rect x="585.0" y="241.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="700" y="266.5" text-anchor="middle" font-size="12.5">Ratification queue: status proposed,</text>
<text x="700" y="281.5" text-anchor="middle" font-size="12.5">owner principal; never adopted</text>
<text x="819.0" y="253.0" font-size="12" font-weight="bold">2008</text>
<polygon points="300,334 445,380 300,426 155,380" fill="white" stroke="black" stroke-width="1.6"/>
<text x="300" y="376.5" text-anchor="middle" font-size="12.5">Score at or above threshold</text>
<text x="300" y="391.5" text-anchor="middle" font-size="12.5">and not a near-duplicate?</text>
<text x="449" y="350" font-size="12" font-weight="bold">2010</text>
<rect x="585.0" y="351.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="700" y="376.5" text-anchor="middle" font-size="12.5">Reject: reason and</text>
<text x="700" y="391.5" text-anchor="middle" font-size="12.5">score recorded</text>
<text x="819.0" y="363.0" font-size="12" font-weight="bold">2012</text>
<polygon points="300,444 445,490 300,536 155,490" fill="white" stroke="black" stroke-width="1.6"/>
<text x="300" y="486.5" text-anchor="middle" font-size="12.5">Anchored to a</text>
<text x="300" y="501.5" text-anchor="middle" font-size="12.5">ratified objective?</text>
<text x="449" y="460" font-size="12" font-weight="bold">2014</text>
<rect x="585.0" y="461.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="700" y="486.5" text-anchor="middle" font-size="12.5">Probation: novel goal, flagged</text>
<text x="700" y="501.5" text-anchor="middle" font-size="12.5">overdue without evidence</text>
<text x="819.0" y="473.0" font-size="12" font-weight="bold">2016</text>
<rect x="185.0" y="561.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="300" y="586.5" text-anchor="middle" font-size="12.5">Adopt derived goal: parent</text>
<text x="300" y="601.5" text-anchor="middle" font-size="12.5">objective, alignment, ledger row</text>
<text x="419.0" y="573.0" font-size="12" font-weight="bold">2018</text>
<rect x="185.0" y="651.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="300" y="676.5" text-anchor="middle" font-size="12.5">Dispatch and drain: research queue,</text>
<text x="300" y="691.5" text-anchor="middle" font-size="12.5">task ledger, managers</text>
<text x="419.0" y="663.0" font-size="12" font-weight="bold">2020</text>
<polygon points="300,734 445,780 300,826 155,780" fill="white" stroke="black" stroke-width="1.6"/>
<text x="300" y="776.5" text-anchor="middle" font-size="12.5">DoD met, stale past limit,</text>
<text x="300" y="791.5" text-anchor="middle" font-size="12.5">or superseded?</text>
<text x="449" y="750" font-size="12" font-weight="bold">2022</text>
<polygon points="700,544 845,590 700,636 555,590" fill="white" stroke="black" stroke-width="1.6"/>
<text x="700" y="586.5" text-anchor="middle" font-size="12.5">Principal ratifies</text>
<text x="700" y="601.5" text-anchor="middle" font-size="12.5">novel goal?</text>
<text x="849" y="560" font-size="12" font-weight="bold">2024</text>
<rect x="585.0" y="671.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="700" y="696.5" text-anchor="middle" font-size="12.5">Objective space: ratified goal</text>
<text x="700" y="711.5" text-anchor="middle" font-size="12.5">becomes standing, parent for new goals</text>
<text x="819.0" y="683.0" font-size="12" font-weight="bold">2026</text>
<rect x="185.0" y="861.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="300" y="886.5" text-anchor="middle" font-size="12.5">Retire with disposition:</text>
<text x="300" y="901.5" text-anchor="middle" font-size="12.5">retired_at, reason, ledger cancelled</text>
<text x="419.0" y="873.0" font-size="12" font-weight="bold">2028</text>
