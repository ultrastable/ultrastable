<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="black"/></marker></defs>
<text x="450.0" y="28" text-anchor="middle" font-size="18" font-weight="bold">FIG. 15  Idea-to-organization bootstrapper</text>
<rect x="215.0" y="51.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="330" y="76.5" text-anchor="middle" font-size="12.5">Idea file: idea, users, first outcomes,</text>
<text x="330" y="91.5" text-anchor="middle" font-size="12.5">constraints (sole human input)</text>
<text x="449.0" y="63.0" font-size="12" font-weight="bold">1502</text>
<rect x="215.0" y="141.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="330" y="166.5" text-anchor="middle" font-size="12.5">Read and detect: credentials and tools</text>
<text x="330" y="181.5" text-anchor="middle" font-size="12.5">present (presence only), environment</text>
<text x="449.0" y="153.0" font-size="12" font-weight="bold">1504</text>
<rect x="215.0" y="231.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="330" y="256.5" text-anchor="middle" font-size="12.5">Select: model tier from stated budget;</text>
<text x="330" y="271.5" text-anchor="middle" font-size="12.5">reviewer model of another family</text>
<text x="449.0" y="243.0" font-size="12" font-weight="bold">1506</text>
<rect x="215.0" y="321.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="330" y="346.5" text-anchor="middle" font-size="12.5">Plan: roles per outcome, shared staff,</text>
<text x="330" y="361.5" text-anchor="middle" font-size="12.5">backlog, items, predictions, gate cards</text>
<text x="449.0" y="333.0" font-size="12" font-weight="bold">1508</text>
<rect x="215.0" y="411.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="330" y="436.5" text-anchor="middle" font-size="12.5">Write: charter, roles, instruction files,</text>
<text x="330" y="451.5" text-anchor="middle" font-size="12.5">autonomy policy, idempotent seed SQL</text>
<text x="449.0" y="423.0" font-size="12" font-weight="bold">1510</text>
<rect x="215.0" y="501.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="330" y="526.5" text-anchor="middle" font-size="12.5">Provision: database, server worker,</text>
<text x="330" y="541.5" text-anchor="middle" font-size="12.5">scheduled heartbeat</text>
<text x="449.0" y="513.0" font-size="12" font-weight="bold">1512</text>
<rect x="215.0" y="591.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="330" y="616.5" text-anchor="middle" font-size="12.5">Start: first tick; boot success stored</text>
<text x="330" y="631.5" text-anchor="middle" font-size="12.5">as a scored prediction</text>
<text x="449.0" y="603.0" font-size="12" font-weight="bold">1514</text>
<rect x="545.0" y="321.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="660" y="339.0" text-anchor="middle" font-size="12.5">Stage fails: record as work item</text>
<text x="660" y="354.0" text-anchor="middle" font-size="12.5">(owner, blocker, closing probe);</text>
<text x="660" y="369.0" text-anchor="middle" font-size="12.5">continue degraded</text>
<text x="779.0" y="333.0" font-size="12" font-weight="bold">1516</text>
