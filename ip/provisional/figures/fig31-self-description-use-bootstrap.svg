<svg xmlns="http://www.w3.org/2000/svg" width="960" height="930" viewBox="0 0 960 930" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="black"/></marker></defs>
<text x="480.0" y="28" text-anchor="middle" font-size="18" font-weight="bold">FIG. 31  Use of the self-description by sessions, the tick and the bootstrapper</text>
<rect x="185.0" y="66.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="300" y="91.5" text-anchor="middle" font-size="12.5">Fresh session, wiped machine or</text>
<text x="300" y="106.5" text-anchor="middle" font-size="12.5">new account with seed and repository</text>
<text x="419.0" y="78.0" font-size="12" font-weight="bold">3102</text>
<rect x="185.0" y="166.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="300" y="191.5" text-anchor="middle" font-size="12.5">Read protocol, role file, policy,</text>
<text x="300" y="206.5" text-anchor="middle" font-size="12.5">then self-description</text>
<text x="419.0" y="178.0" font-size="12" font-weight="bold">3104</text>
<rect x="185.0" y="266.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="300" y="291.5" text-anchor="middle" font-size="12.5">Derive ceilings, rungs, gates, limits;</text>
<text x="300" y="306.5" text-anchor="middle" font-size="12.5">what exists; what is broken</text>
<text x="419.0" y="278.0" font-size="12" font-weight="bold">3106</text>
<rect x="185.0" y="366.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="300" y="391.5" text-anchor="middle" font-size="12.5">Detect access map: which surfaces</text>
<text x="300" y="406.5" text-anchor="middle" font-size="12.5">and credentials exist (presence only)</text>
<text x="419.0" y="378.0" font-size="12" font-weight="bold">3108</text>
<polygon points="300,464 445,510 300,556 155,510" fill="white" stroke="black" stroke-width="1.6"/>
<text x="300" y="506.5" text-anchor="middle" font-size="12.5">Required surface</text>
<text x="300" y="521.5" text-anchor="middle" font-size="12.5">missing?</text>
<text x="449" y="480" font-size="12" font-weight="bold">3110</text>
<rect x="625.0" y="481.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="740" y="506.5" text-anchor="middle" font-size="12.5">Gate card with default in effect</text>
<text x="740" y="521.5" text-anchor="middle" font-size="12.5">and closing probe; degrade</text>
<text x="859.0" y="493.0" font-size="12" font-weight="bold">3112</text>
<polygon points="300,584 445,630 300,676 155,630" fill="white" stroke="black" stroke-width="1.6"/>
<text x="300" y="626.5" text-anchor="middle" font-size="12.5">Manager tick consults description:</text>
<text x="300" y="641.5" text-anchor="middle" font-size="12.5">item within ceiling and rung?</text>
<text x="449" y="600" font-size="12" font-weight="bold">3114</text>
<rect x="625.0" y="601.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="740" y="626.5" text-anchor="middle" font-size="12.5">Refuse, record, take next item;</text>
<text x="740" y="641.5" text-anchor="middle" font-size="12.5">no workaround of the check</text>
<text x="859.0" y="613.0" font-size="12" font-weight="bold">3116</text>
<rect x="185.0" y="721.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="300" y="746.5" text-anchor="middle" font-size="12.5">Claim, act, verify, record</text>
<text x="300" y="761.5" text-anchor="middle" font-size="12.5">provenance and prediction</text>
<text x="419.0" y="733.0" font-size="12" font-weight="bold">3118</text>
<rect x="185.0" y="831.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="300" y="856.5" text-anchor="middle" font-size="12.5">Bootstrapper stages 1508 to 1514:</text>
<text x="300" y="871.5" text-anchor="middle" font-size="12.5">emit tenant description from policy</text>
<text x="419.0" y="843.0" font-size="12" font-weight="bold">3120</text>
<rect x="625.0" y="831.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="740" y="856.5" text-anchor="middle" font-size="12.5">Sync job: repository to tenant database</text>
<text x="740" y="871.5" text-anchor="middle" font-size="12.5">and back; platform backlog is tenant one</text>
<text x="859.0" y="843.0" font-size="12" font-weight="bold">3122</text>
<line x1="300" y1="124" x2="300" y2="166" stroke="black" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="300" y1="224" x2="300" y2="266" stroke="black" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="300" y1="324" x2="300" y2="366" stroke="black" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="300" y1="424" x2="300" y2="464" stroke="black" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M445,510 L520,510 L625,510" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#a)"/>
<text x="526" y="506" font-size="11.5" font-style="italic">yes</text>
<line x1="300" y1="556" x2="300" y2="584" stroke="black" stroke-width="1.4" marker-end="url(#a)"/>
<text x="306.0" y="566.0" font-size="11.5" font-style="italic">no</text>
<path d="M740,539 L740,570 L430,630 L445,630" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#a)"/>
<line x1="445" y1="630" x2="625" y2="630" stroke="black" stroke-width="1.4" marker-end="url(#a)"/>
<text x="541.0" y="626.0" font-size="11.5" font-style="italic">no</text>
<line x1="300" y1="676" x2="300" y2="721" stroke="black" stroke-width="1.4" marker-end="url(#a)"/>
<text x="306.0" y="694.5" font-size="11.5" font-style="italic">yes</text>
<line x1="300" y1="779" x2="300" y2="831" stroke="black" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="415" y1="860" x2="625" y2="860" stroke="black" stroke-width="1.4" marker-end="url(#a)"/>
</svg>