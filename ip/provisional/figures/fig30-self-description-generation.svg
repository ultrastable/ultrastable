<text x="300" y="206.5" text-anchor="middle" font-size="12.5">vocabulary, objective, SPOF, policy</text>
<text x="419.0" y="178.0" font-size="12" font-weight="bold">3004</text>
<rect x="185.0" y="266.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
