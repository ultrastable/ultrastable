<text x="480.0" y="28" text-anchor="middle" font-size="18" font-weight="bold">FIG. 30  Self-description generation, diff, consistency check and amendment</text>
<rect x="185.0" y="66.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="300" y="91.5" text-anchor="middle" font-size="12.5">Trigger: schedule, merge to default</text>
<text x="300" y="106.5" text-anchor="middle" font-size="12.5">branch, or ledger change event</text>
<text x="419.0" y="78.0" font-size="12" font-weight="bold">3002</text>
