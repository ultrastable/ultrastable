<text x="360.0" y="28" text-anchor="middle" font-size="18" font-weight="bold">FIG. 4  Plus loop (evidence-driven improvement)</text>
<rect x="215.0" y="51.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="330" y="76.5" text-anchor="middle" font-size="12.5">Pick product: oldest last-plus,</text>
<text x="330" y="91.5" text-anchor="middle" font-size="12.5">weighted by usage and friction</text>
<text x="449.0" y="63.0" font-size="12" font-weight="bold">402</text>
<rect x="215.0" y="141.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="330" y="166.5" text-anchor="middle" font-size="12.5">Gather evidence without principal</text>
<text x="330" y="181.5" text-anchor="middle" font-size="12.5">input (usage, errors, asks, peers)</text>
<text x="449.0" y="153.0" font-size="12" font-weight="bold">404</text>
<rect x="215.0" y="231.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="330" y="256.5" text-anchor="middle" font-size="12.5">Write one additive, reversible plus</text>
<text x="330" y="271.5" text-anchor="middle" font-size="12.5">with stated prediction</text>
<text x="449.0" y="243.0" font-size="12" font-weight="bold">406</text>
<rect x="215.0" y="321.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="330" y="346.5" text-anchor="middle" font-size="12.5">Ship via work ledger, executor,</text>
<text x="330" y="361.5" text-anchor="middle" font-size="12.5">canary and automatic revert</text>
<text x="449.0" y="333.0" font-size="12" font-weight="bold">408</text>
<polygon points="330,414 475,460 330,506 185,460" fill="white" stroke="black" stroke-width="1.6"/>
<text x="330" y="456.5" text-anchor="middle" font-size="12.5">Outcome improved and</text>
<text x="330" y="471.5" text-anchor="middle" font-size="12.5">no guard regressed?</text>
<text x="479" y="430" font-size="12" font-weight="bold">410</text>
<rect x="35.0" y="551.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="150" y="576.5" text-anchor="middle" font-size="12.5">Keep; seed next plus</text>
<text x="150" y="591.5" text-anchor="middle" font-size="12.5">(&quot;plus the plus&quot;)</text>
<text x="269.0" y="563.0" font-size="12" font-weight="bold">412</text>
<rect x="395.0" y="551.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="510" y="576.5" text-anchor="middle" font-size="12.5">Revert; try new angle;</text>
<text x="510" y="591.5" text-anchor="middle" font-size="12.5">rest after 3 misses</text>
<text x="629.0" y="563.0" font-size="12" font-weight="bold">414</text>
<rect x="215.0" y="661.0" width="230" height="58" rx="4" fill="white" stroke="black" stroke-width="1.6"/>
<text x="330" y="686.5" text-anchor="middle" font-size="12.5">Every Nth cycle: simplify pass;</text>
<text x="330" y="701.5" text-anchor="middle" font-size="12.5">weekly digest to principal</text>
<text x="449.0" y="673.0" font-size="12" font-weight="bold">416</text>
