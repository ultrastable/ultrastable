<text x="233.25" y="524.5" font-size="11.5" font-style="italic">yes</text>
<line x1="399" y1="506" x2="466" y2="551" stroke="black" stroke-width="1.4" marker-end="url(#a)"/>
<text x="438.75" y="524.5" font-size="11.5" font-style="italic">no</text>
