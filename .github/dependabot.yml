# DEP-LOOP-1 (YEAR-SIM-1 finding dependency-break): every dependency ecosystem in the repository is advanced by a server-side loop. Dependabot opens
# the change; the merge lane merges it when checks pass. foundation/yearsim.py drill dependency_loop fails when an ecosystem here is missing.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directory: /seed
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
    open-pull-requests-limit: 1
  - package-ecosystem: npm
    directory: /seed/worker
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
    open-pull-requests-limit: 1
  - package-ecosystem: npm
    directory: /workers
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
    open-pull-requests-limit: 1
  - package-ecosystem: npm
    directory: /workers/core
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
    open-pull-requests-limit: 1
  - package-ecosystem: npm
    directory: /workers/adapters/cloudflare
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
    open-pull-requests-limit: 1
