name: seed-launch
# SEED-LAUNCH-1 (Rowan, 2026-11-21): every seed is built, deployed, gated on a year unattended and probed live by the system itself.
# budget: ~6 min x 8 per month (weekly e2e plus fleet, and dispatch)
# trigger: weekly and dispatch; a seed changes the kit at most daily (kit-sync), and the e2e record is fresh for 8 days
# free-alternative: a cloud-hosted agent session runs `python3 -m foundation seedlaunch --e2e --fleet` with the same Cloudflare binding
on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write  # scripts/land_data.py falls back to a pull request when the main writer is refused
  id-token: write  # MAIN-WRITER-1
concurrency:
  group: seed-launch
  cancel-in-progress: false
jobs:
  launch:
    if: ${{ vars.HALT != '1' }}  # HALT-1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 22 }
      - run: python3 scripts/actions_guard.py seed-launch
        env:
          GH_TOKEN: ${{ github.token }}
      - name: A fresh seed and every seeded repository, launched on Ultrastable's own account and verified live
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 81e3a4efb4eb66e613529b87682911bb  # SINGLE-ACCOUNT-1: pinned, never the repo secret (the first run landed in the retired account)
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
        run: python3 -m foundation seedlaunch --e2e --fleet
      - name: Land the launch records on main
        if: always()
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
        run: python3 scripts/land_data.py "seed launch records (SEED-LAUNCH-1)" ops/seed-launches.jsonl
