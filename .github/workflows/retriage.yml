name: retriage
# budget: ~1 min x 4/month
# trigger: weekly retriage
# free-alternative: Cloudflare cron worker
# Every 3 hours: enable auto-merge on green PRs, flag conflicts and idle drafts, file gaps for issues without a doer or probe.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: retriage
  cancel-in-progress: false
jobs:
  retriage:
    if: ${{ vars.HALT != '1' }}  # HALT-1: the owner's halt (repository variable HALT=1) stops every job
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Budget kill switch
        env: {GH_TOKEN: "${{ github.token }}"}
        run: python3 scripts/actions_guard.py retriage
      - name: Retriage
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
        run: bash scripts/retriage.sh
