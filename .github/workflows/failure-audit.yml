name: failure-audit
# FAILURE-AUDIT-1: the system audits its own failure modes. Daily only; the primary clock is the Cloudflare tick.
# budget: ~8 min x 30 per month
# trigger: daily and dispatch; failure modes drift over days, so a faster event buys nothing
# free-alternative: run `python3 -m foundation failure_audit --run` from any local scheduler or the Cloudflare cron worker
# Runs doctrine/detectors.json, appends ops/failure-audit.jsonl and files or clears docs/issues/AUDIT-*.json; the evidence is committed to
# branch audit-evidence, which the next run starts from so streaks (same signature twice = change approach, three = incident) persist.
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: failure-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - run: python3 scripts/actions_guard.py failure-audit
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Start from the loop's own evidence when it exists
        run: |
          if git ls-remote --exit-code --heads origin audit-evidence >/dev/null; then
            git fetch origin audit-evidence
            git checkout origin/audit-evidence -- ops docs/issues
          fi
      - run: python3 -m foundation failure_audit --run
        continue-on-error: true
      - name: Commit the evidence
        run: |
          git config user.name "ultrastable-audit"
          git config user.email "actions@users.noreply.github.com"
          git add ops/failure-audit.jsonl docs/issues
          if git diff --cached --quiet; then echo "no change"; else git commit -m "failure-audit: ledger and findings" && git push origin HEAD:refs/heads/audit-evidence --force; fi
