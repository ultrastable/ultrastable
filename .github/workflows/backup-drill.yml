name: backup-drill
# budget: ~2 min x 1 per week = ~10 min per month
# trigger: weekly (backups change slowly; foundation/backup.py skips a drill that is fresher than max_age_days) and manual dispatch
# free-alternative: `python3 -m foundation backup --run --apply` from any cloud launch host with the Cloudflare token, or the Cloudflare tick worker
# BLINDSPOT-1 need backup-restore: exports every D1 database and KV namespace of the pinned Ultrastable account, restores each dump into scratch SQLite, compares row counts, stores and reads back. Uses the same CLOUDFLARE_API_TOKEN secret the deploy workflows use; no credential is minted.
on:
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
  id-token: write  # MAIN-WRITER-1
concurrency:
  group: backup-drill
  cancel-in-progress: false
jobs:
  drill:
    if: ${{ vars.HALT != '1' }}  # HALT-1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Drill
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 -m foundation backup --run --apply --force
      - name: Land the record
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
        run: python3 scripts/land_data.py "backup drill record (BLINDSPOT-1)" ops/backup docs/issues
