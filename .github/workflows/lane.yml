name: lane
# One job: review and merge every PR with no human. Events: PR changes, check completions, every 10 minutes.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  workflow_run:
    workflows: [checks]
    types: [completed]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: write
concurrency:
  group: lane
  cancel-in-progress: false
jobs:
  lane:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Run the lane
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
        run: bash scripts/lane.sh
