name: lane
# budget: ~1 min per checks completion
# trigger: merge lane after checks succeed; no cron
# free-alternative: Cloudflare cron worker or enable-auto-merge on each PR
# One job: review and merge every PR with no human. Events: checks completing, plus one daily fallback sweep.
# NEEDS-PAT-1 (server-side only): PRs that change .github/workflows/** are merged here too, on green, when a workflow-capable credential
# is bound: secret LANE_PAT, or a GitHub App (secrets LANE_APP_ID and LANE_APP_PRIVATE_KEY). With neither, they stay open and labeled needs-pat.
on:
  workflow_run:
    workflows: [checks]
    types: [completed]
  schedule:
    - cron: "11 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: write
concurrency:
  group: lane
  cancel-in-progress: false
jobs:
  lane:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Run the lane
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
          LANE_PAT: ${{ secrets.LANE_PAT }}
          LANE_APP_ID: ${{ secrets.LANE_APP_ID }}
          LANE_APP_PRIVATE_KEY: ${{ secrets.LANE_APP_PRIVATE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash scripts/lane.sh
      - name: No green PR stays open (LANE-WATCH-1)
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
        run: python3 -m foundation lanewatch --check
      - name: Completion sweep (daily sweep and manual only; COMPLETE-1)
        if: github.event_name != 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
        run: bash scripts/completion_sweep.sh
      - name: Drift probe (daily sweep and manual only)
        if: github.event_name != 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
        run: bash scripts/drift_probe.sh
