name: lane
# budget: ~1.5 min per checks completion (lane pass about 1 min, heal pass about 20 s, capped at 4 min)
# trigger: merge lane after checks succeed; no cron
# free-alternative: Cloudflare cron worker or enable-auto-merge on each PR
# LANE-WORKER-MERGE-1 probe: a workflow-file change merges through the tick Worker app with no stored credential.
# One job: review and merge every PR with no human. Events: checks completing, plus one daily fallback sweep.
# NEEDS-PAT-1 (server-side only): PRs that change .github/workflows/** are merged here too, on green, when a workflow-capable credential
# is bound: secret LANE_PAT, or a GitHub App (secrets LANE_APP_ID and LANE_APP_PRIVATE_KEY). With neither, they stay open and labeled needs-pat.
on:
  workflow_run:
    workflows: [checks]
    types: [completed]
  schedule:
    - cron: "11 5 * * *"
  workflow_dispatch:
permissions:
  id-token: write  # MAIN-WRITER-1: the adoption commit goes through tools/push_main.py, never a direct push to the protected main
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: write
concurrency:
  group: lane
  cancel-in-progress: false
jobs:
  lane:
    if: ${{ vars.HALT != '1' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}  # HALT-1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - name: Run the lane
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
          LANE_PAT: ${{ secrets.LANE_PAT }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          FLEET_TOKEN: ${{ secrets.FLEET_TOKEN }}
          LANE_APP_ID: ${{ secrets.LANE_APP_ID }}
          LANE_APP_PRIVATE_KEY: ${{ secrets.LANE_APP_PRIVATE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash scripts/lane.sh
      - name: Every push workflow a merge touched runs (POSTMERGE-DISPATCH-1; GITHUB_TOKEN merges fire no push events)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
        run: python3 scripts/postmerge_dispatch.py --apply
      - name: No green PR stays open (LANE-WATCH-1)
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
        run: python3 -m foundation lanewatch --check --remediate
      - name: Completion sweep (daily sweep and manual only; COMPLETE-1)
        if: github.event_name != 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
        run: bash scripts/completion_sweep.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: {node-version: 24}
      - name: Drift probe (daily sweep and manual only)
        if: github.event_name != 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/drift_probe.sh
      - name: Heal the clocks after every lane pass (Q-CLOCK-LANE-HOOK; catch-up, settlement, escalation)
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        run: python3 -m foundation clock --heal --apply
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
