name: lane
# budget: ~1 min per checks completion
# trigger: merge lane after checks succeed; no cron
# free-alternative: Cloudflare cron worker or enable-auto-merge on each PR
# One job: review and merge every PR with no human. Events: checks completing, plus one daily fallback sweep.
on:
  workflow_run:
    workflows: [checks]
    types: [completed]
  schedule:
    - cron: "11 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: write
concurrency:
  group: lane
  cancel-in-progress: false
jobs:
  lane:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Run the lane
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
        run: bash scripts/lane.sh
