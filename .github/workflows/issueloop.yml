name: issueloop
# budget: ~0.5 min x 1 per day = ~15 min per month
# trigger: daily schedule (issues change by filing, which the lane and executor already trigger on; daily is the slowest honest clock) and manual dispatch
# free-alternative: `python3 -m foundation issueloop --apply` from any launch host, or the Cloudflare tick worker
# ISSUE-LOOP-1: every open issue's probe is evaluated and a passing one is closed with its evidence.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
permissions:
  id-token: write  # MAIN-WRITER-1: tools/push_main.py presents the run's OIDC token
  contents: write  # files Q-ISSUE-* queue items for issues it cannot close and commits them, like the deploy record step
  issues: write
concurrency:
  group: issueloop
  cancel-in-progress: true
jobs:
  loop:
    if: ${{ vars.HALT != '1' }}  # HALT-1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Probe and close issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m foundation issueloop --apply --file
      - name: Archive closed queue items (STATE-ARCHIVE-1, ZHC-R1)
        run: python3 -m foundation statesink --archive --apply
      - name: Commit filed queue items
        run: |
          git config user.name "ultrastable-bot"; git config user.email "bot@users.noreply.github.com"
          python3 -m foundation balance --gate --apply  # FLOW-BALANCE-1: the one filing gate before any item lands
          if [ -f ops/balance-held.jsonl ]; then git add ops/balance-held.jsonl; fi
          git add docs/issues
          bash tools/record_main.sh "issueloop: file Q-ISSUE items and archive closed ones"
