name: cost-guard
# budget: ~1 min per run, once a day (~30 min per month)
# trigger: daily schedule; cost data changes by day, so faster adds nothing (COST-GUARD-1)
# free-alternative: run `python3 -m foundation cost --guard --apply` from a cloud-hosted Claude session with CLOUDFLARE_API_TOKEN bound
# Also runs the criticality tick (k = verified deploys / (cost + human touches)) and logs it to ops/criticality.jsonl.
# Runs deploy/cost-probe.mjs (D1 rows read and Workers AI neurons into ops/cost.jsonl, a queue item per breach) and then the criticality tick.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}
permissions:
  id-token: write  # MAIN-WRITER-1: tools/push_main.py presents the run's OIDC token
  contents: write
concurrency:
  group: cost-guard
  cancel-in-progress: false
jobs:
  cost-guard:
    if: ${{ vars.HALT != '1' }}  # HALT-1: the owner's halt (repository variable HALT=1) stops every job
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: {node-version: 24}
      - name: Probe and guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node deploy/cost-probe.mjs
      - name: Cloudflare account posture (CF-POSTURE-1)
        if: ${{ !cancelled() }}  # the posture reading does not depend on the cost probe: one failing must not hide the other
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 -m foundation cfposture --probe --apply
      - name: Criticality tick (CRITICALITY-1)
        run: python3 -m foundation criticality --tick --apply
      - name: Ultrastability tick (ULTRASTABILITY-1)
        run: |
          python3 -m foundation ultrastability --tenants --apply
          python3 -m foundation ultrastability --tick --apply
          python3 -m foundation ultrastability --data --apply  # ONE-YEAR-READY-1: page shows the readings this tick wrote
          python3 -m foundation selfmodel --apply
      - name: Record
        run: |
          git config user.name "ultrastable-bot"; git config user.email "bot@users.noreply.github.com"
          python3 -m foundation balance --gate --apply  # FLOW-BALANCE-1: the one filing gate before any item lands
          if [ -f ops/balance-held.jsonl ]; then git add ops/balance-held.jsonl; fi
          git add ops/cost.jsonl ops/cf-posture.json ops/criticality.jsonl ops/ultrastability.jsonl site/ultrastability-data.js doctrine/ultrastability.json site/self-data.js ops/tenants doctrine/clocks.json ops/provenance.jsonl docs/issues
          git diff --cached --quiet || { git commit -m "cost-guard: daily reading"; python3 tools/push_main.py; }
