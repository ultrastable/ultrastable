name: cost-guard
# budget: ~1 min per run, once a day (~30 min per month)
# trigger: daily schedule; cost data changes by day, so faster adds nothing (COST-GUARD-1)
# free-alternative: run `python3 -m foundation cost --guard --apply` from a cloud-hosted Claude session with CLOUDFLARE_API_TOKEN bound
# Reads yesterday's D1 rows read and Workers AI neurons, appends ops/cost.jsonl, files a queue item per budget breach.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: cost-guard
  cancel-in-progress: false
jobs:
  cost-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Probe and guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 -m foundation cost --probe --apply
      - name: Record
        run: |
          git config user.name "ultrastable-bot"; git config user.email "bot@users.noreply.github.com"
          git add ops/cost.jsonl docs/issues
          git diff --cached --quiet || { git commit -m "cost-guard: daily reading"; git push; }
