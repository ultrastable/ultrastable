name: tenant-repos
# SPDX-License-Identifier: LicenseRef-Ultrastable-USL-1.0
# TENANT-REPO-1: every tenant app lives in its own repository. For each tenant doctrine/tenant-repos.json marks "moving", this creates the
# repository when it is missing (with the tenant folder's history, split from this repository, core files vendored). The tenant's Worker is
# deployed by this repository's deploy-ultrastable from the tenant repository (doctrine/topology.json `source`).
# Daily it also redeploys any moved tenant whose repository's main moved past the last deployed commit (deploy-ultrastable builds from it).
# budget: ~3 min per run (one test idea is built and bundled; at most two visitor apps are deployed); once a day, plus when the registry changes on main, or by dispatch
# trigger: daily (a tenant repository's push cannot start this repository's deploy without a stored credential), push to the registry, dispatch
# free-alternative: `python3 -m foundation tenantrepos --missing` and the same git and API steps from a cloud-hosted agent session
on:
  schedule:
    - cron: "23 5 * * *"
  push:
    branches: [main]
    paths: ["doctrine/tenant-repos.json", "doctrine/full-stack.json", ".github/workflows/tenant-repos.yml", "deploy/launch-apps.mjs"]
  workflow_dispatch:
permissions:
  contents: read
  actions: write  # dispatches deploy-ultrastable for a tenant whose repository moved
  id-token: write  # LAUNCH-PATH-1: the launch queue and the app deploys go through the site worker's OIDC route, no stored credential
concurrency:
  group: tenant-repos
  cancel-in-progress: false
jobs:
  repos:
    if: ${{ vars.HALT != '1' }}  # HALT-1: the owner's halt stops every job
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # the checkout's own token is sent as a header on every github.com push and wins over the token in the URL,
          # so a push to a new tenant repository went as github-actions[bot] and was refused (run 45669381614)
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: {node-version: 24}
      - name: Create each missing tenant repository from its folder's history
        env:
          ORG_ADMIN_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          LANE_PAT: ${{ secrets.LANE_PAT }}
          LANE_APP_ID: ${{ secrets.LANE_APP_ID }}
          LANE_APP_PRIVATE_KEY: ${{ secrets.LANE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          python3 -m foundation tenantrepos --check
          git config --global user.name "ultrastable-bot"; git config --global user.email "bot@users.noreply.github.com"
          python3 -m foundation tenantrepos --missing > missing.json
          # third route: the lane's GitHub App, as an installation token over the whole installation (logged refusal, never hidden)
          APP_TOKEN=""
          if [ -n "$LANE_APP_ID" ] && [ -n "$LANE_APP_PRIVATE_KEY" ]; then
            if APP_TOKEN="$(python3 scripts/lane_credential.py org-token)"; then echo "::add-mask::$APP_TOKEN"; else APP_TOKEN=""; echo "::warning::the lane App gave no org token"; fi
          fi
          jq -c '.[]' missing.json | while read -r row; do
            slug=$(jq -r .slug <<<"$row"); repo=$(jq -r .repo <<<"$row"); src=$(jq -r .source <<<"$row")
            name=${repo#*/}; org=${repo%%/*}
            # three routes to an org-scoped credential; the first that can see or create the repository is used
            tok=""; for t in "$ORG_ADMIN_TOKEN" "$LANE_PAT" "$APP_TOKEN"; do
              [ -n "$t" ] || continue
              if GH_TOKEN="$t" gh api "repos/$repo" >/dev/null 2>&1; then tok="$t"; break; fi
              if GH_TOKEN="$t" gh api "orgs/$org/repos" -f name="$name" -f visibility="$(jq -r '.visibility // "public"' <<<"$row")" \
                   -f description="$(jq -r '.description // ""' <<<"$row")" -F has_wiki=false >/dev/null; then echo "created $repo"; tok="$t"; break; fi
              echo "::warning::this credential could not create $repo; trying the next route"
            done
            # fourth route, no stored credential (TENANT-REPO-2): the tick Worker's administration app creates it over the site's OIDC route and
            # hands back a one-hour push token for this one repository while it is still empty
            if [ -z "$tok" ]; then
              if srv="$(node deploy/tenant-repo-token.mjs "$repo" "$(jq -r '.visibility // "public"' <<<"$row")" "$(jq -r '.description // ""' <<<"$row")")"; then
                if [ "$srv" = "has-history" ]; then echo "$repo already has history; left as it is"; continue; fi
                echo "::add-mask::$srv"; tok="$srv"
              else echo "::warning::the platform's own route could not create $repo (logged above)"; fi
            fi
            # one tenant without a credential must not stop the others or the redeploy step below: record it, go on, fail at the end
            if [ -z "$tok" ]; then echo "::error::no route could create $repo (ORG_ADMIN_TOKEN, LANE_PAT, lane App, platform OIDC route)"; echo "$repo" >> /tmp/tenant-repos-failed; continue; fi
            # an empty repository answers 409 here; that answer is logged, not hidden, and means "push the split"
            if head_sha="$(GH_TOKEN="$tok" gh api "repos/$repo/commits?per_page=1" --jq '.[0].sha' 2>/tmp/commits.err)" && [ -n "$head_sha" ]; then echo "$repo already has history; left as it is"; continue; fi
            echo "no commits yet in $repo: $(cat /tmp/commits.err)"
            git subtree split --prefix "$src" -b "split-$slug"
            git worktree add "/tmp/$slug" "split-$slug"
            python3 -m foundation tenantrepos --prepare "/tmp/$slug" --slug "$slug"
            # the worktree shares the checkout's git config; its auth header (the run's own token) would win over the token in the URL, so it is cleared for this push.
            # a refused push is recorded and the loop goes on to the next tenant, so one repository never stops the others
            if (cd "/tmp/$slug" && git add -A && { git diff --cached --quiet || git commit -q -m "Stand alone: vendor the core files $slug reads (TENANT-REPO-1)"; } \
              && git -c "http.https://github.com/.extraheader=" push "https://x-access-token:${tok}@github.com/${repo}.git" "HEAD:refs/heads/main"); then
              echo "pushed $src with its history to $repo"
            else echo "::error::could not push $src to $repo"; echo "$repo" >> /tmp/tenant-repos-failed; fi
          done
          if [ -s /tmp/tenant-repos-failed ]; then echo "::error::tenant repositories not created: $(tr '\n' ' ' </tmp/tenant-repos-failed)"; exit 1; fi
      - name: Every seed has its own repository, filled from the seed (FULLSTACK-1)
        # A seed in doctrine/seed-deploys.json whose doctrine/full-stack.json row names a repository gets that repository over the same
        # credential-free route as a tenant (TENANT-REPO-2). While it is empty it is filled once from seed/; one with history is left alone.
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          fail=0
          while read -r id repo; do
            [ -n "$repo" ] || continue
            if ! srv="$(node deploy/tenant-repo-token.mjs "$repo" public "An Ultrastable system: $id")"; then echo "::error::no route could create $repo"; fail=1; continue; fi
            if [ "$srv" = "has-history" ]; then echo "$repo already has history; left as it is"; continue; fi
            echo "::add-mask::$srv"
            d="$(mktemp -d)"; cp -a seed/. "$d/"
            git -C "$d" init -q -b main; git -C "$d" add -A
            git -C "$d" -c user.name="ultrastable" -c user.email="ultrastable@users.noreply.github.com" commit -q -m "Start from the Ultrastable seed (FULLSTACK-1)"
            if git -C "$d" push -q "https://x-access-token:${srv}@github.com/${repo}.git" "HEAD:refs/heads/main"; then echo "filled $repo from seed/"; continue; fi
            # a token without the workflows grant may not push workflow files; the rest still goes, and the miss is said
            echo "::warning::$repo refused the push with workflow files; pushing without .github/workflows"
            git -C "$d" rm -rq --cached .github/workflows
            git -C "$d" -c user.name="ultrastable" -c user.email="ultrastable@users.noreply.github.com" commit -q --amend -m "Start from the Ultrastable seed, without its workflows (FULLSTACK-1)"
            if git -C "$d" push -q "https://x-access-token:${srv}@github.com/${repo}.git" "HEAD:refs/heads/main"; then echo "filled $repo from seed/ without workflows"; else echo "::error::could not fill $repo"; fail=1; fi
          done < <(jq -r --slurpfile s doctrine/seed-deploys.json '.systems | to_entries[] | select(.key as $k | $s[0].seeds | index($k)) | select(.value.repo) | "\(.key) \(.value.repo)"' doctrine/full-stack.json)
          exit $fail
      - name: Launch what visitors asked for, and walk a test idea through the front door (LAUNCH-PATH-1)
        # Someone with no code agent typed an idea at ultrastable.io. This deploys its own system, gives it a repository from the seed, files the
        # owner's plain-words requests there and invites the owner when they asked. The test idea fails the job on any step a visitor would have to do.
        if: always()
        # No GitHub credential here: the repository work is done by the tick Worker with the App credentials it already holds (APP-REPO-1).
        run: |
          set -euo pipefail
          node deploy/launch-apps.mjs --probe
      - name: Redeploy tenants whose repository moved past the last deploy
        if: ${{ !cancelled() }}  # moved tenants redeploy even when creating another tenant's repository failed above
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          w=$(python3 -m foundation tenantrepos --behind)
          if [ -n "$w" ]; then gh workflow run deploy-ultrastable.yml --ref main -f workers="$w"; echo "dispatched deploy of $w"; else echo "every moved tenant is deployed at its main"; fi
      - name: Every system has a repository, a live back end and a public front end (FULLSTACK-1)
        # Fetches each system's front end and back end. Red when a part is missing or does not answer; the missing part's queue item is the fix.
        if: always()
        run: python3 -m foundation fullstack --live
      - name: Every system's knowledge graph is built and fresh (DATAGRAPH-LIVE-1)
        if: ${{ !cancelled() }}
        run: python3 -m foundation datagraph --live
