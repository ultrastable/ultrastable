name: smoke-explore
# budget: ~0.5 min per run, manual and branch push only
# trigger: push to the audit branch (one-off exploration of the live sites); removed when smoke-live lands
# free-alternative: the same script from any cloud launch host
on:
  push:
    branches: [claude/project-thread-sgqjgx]
    paths: [scripts/smoke_probe.py, .github/workflows/smoke-explore.yml]
permissions:
  contents: read
concurrency:
  group: smoke-explore
  cancel-in-progress: true
jobs:
  probe:
    if: ${{ vars.HALT != '1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: Probe
        run: |
          for h in ultrastable.io ultrastable.org; do
            python3 scripts/smoke_probe.py https://$h/ https://$h/catalogue https://$h/ask https://$h/es/ https://$h/fr/ https://$h/pt/ https://$h/ar/ https://$h/progress https://$h/digest/daily https://$h/digest/weekly https://$h/digest/monthly https://$h/progress.atom https://$h/progress.json https://$h/changes https://$h/evidence-map https://$h/ranking https://$h/pilot https://$h/customer-zero https://$h/demo https://$h/privacy https://$h/openapi.json https://$h/claims https://$h/api/claims https://$h/live https://$h/api/freshness https://$h/llms.txt https://$h/sitemap.xml https://$h/robots.txt https://$h/oembed https://$h/api/v1/sop
          done
