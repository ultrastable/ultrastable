name: smoke-explore
# budget: ~0.5 min per run, manual and branch push only
# trigger: push to the audit branch (one-off exploration of the live sites); removed when smoke-live lands
# free-alternative: the same script from any cloud launch host
on:
  push:
    branches: [claude/project-thread-sgqjgx]
    paths: [scripts/smoke_live.py, scripts/smoke_probe.py, .github/workflows/smoke-explore.yml]
permissions:
  contents: read
concurrency:
  group: smoke-explore
  cancel-in-progress: true
jobs:
  probe:
    if: ${{ vars.HALT != '1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: Smoke
        run: python3 scripts/smoke_live.py --cap
