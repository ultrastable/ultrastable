name: branchsweep
# BRANCH-SWEEP-1: no remote branch carries work main lacks. Merges every branch that merges (generated-file conflicts resolved by rule, gate after each
# merge), files PORT-BRANCH items for the rest and moves those branches to refs/archive/ (BRANCH-SWEEP-3), and opens one pull request the lane merges. Evidence stays on the PR and in ops/branchsweep-ledger.jsonl.
# budget: ~4 min per run, once a day (~120 min per month)
# trigger: daily schedule; manual dispatch for a drain; SWEEP-BUDGET-1: a pass that ran out of time re-dispatches itself (at most 8 runs a day) until no branch is skipped
# free-alternative: run `python3 -m foundation branchsweep --apply` from a cloud-hosted agent session, or from the lane run on the Cloudflare tick Worker
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
  actions: write  # SWEEP-BUDGET-1: re-dispatch while branches remain
concurrency:
  group: branchsweep
  cancel-in-progress: false
jobs:
  sweep:
    if: ${{ vars.HALT != '1' }}  # HALT-1: the owner's halt (repository variable HALT=1) stops every job
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - run: python3 scripts/actions_guard.py branchsweep
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: {node-version: 24}
      - name: Sweep into one branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "ultrastable-branchsweep"; git config user.email "actions@users.noreply.github.com"
          b=agent/branchsweep-$(date -u +%Y%m%d)
          # SWEEP-BUDGET-1: a later pass the same day continues the open sweep branch instead of force-pushing over its merges
          if git ls-remote --exit-code --heads origin "$b" >/dev/null; then git checkout -B "$b" "origin/$b"; else git checkout -B "$b" origin/main; fi
          # SWEEP-TOOLS-MAIN-1: a continued sweep branch holds the code of the morning it was cut; the pass runs main's tools, never that stale copy
          # (run 44497010885 ran the pre-SWEEP-PRUNE-1 prune and deleted nothing). The sweep commit then carries main's versions of these paths.
          git checkout origin/main -- foundation scripts tools doctrine/branchsweep.json
          python3 -m foundation branchsweep --apply
          # BRANCH-SWEEP-3: a port branch does not stay on the branch list; its tip moves to refs/archive/<name>, read back before the head is deleted.
          # A failed row is in the ledger and the output; it does not stop the sweep pull request, and the next pass retries it.
          python3 -m foundation branchsweep --archive || echo "::warning::branchsweep --archive left rows unarchived (see ops/branchsweep-ledger.jsonl)"
          python3 scripts/build_dashboard.py
          git add -A; git diff --cached --quiet || git commit -m "branchsweep: ledger, PORT items and dashboard"
      - name: Open the pull request the lane merges, then prune what main holds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          b=$(git rev-parse --abbrev-ref HEAD)
          if [ "$(git rev-list --count origin/main..HEAD)" -gt 0 ]; then
            git push origin "$b" || git push -f origin "$b"
            gh pr create --base main --head "$b" --title "branchsweep: merge the branches main lacks" --body "BRANCH-SWEEP-1. Disposition per branch: ops/branchsweep-ledger.jsonl. Handoff: item: BRANCH-SWEEP-1" --label server-owned || echo "pull request already open"
          fi
          python3 -m foundation branchsweep --prune
      - name: Prune stale session branches in every fleet repository (BRANCH-SWEEP-2)
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || github.token }}
        run: python3 -m foundation branchsweep --remote
      - name: Wake the next pass while branches were skipped (SWEEP-BUDGET-1)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skipped=$(tail -n 50 ops/branchsweep-ledger.jsonl | python3 -c "import json,sys; r=[json.loads(l) for l in sys.stdin if '\"entered\"' in l]; print(r[-1]['skipped'] if r else 0)")
          today=$(gh run list -w branchsweep.yml --limit 30 --json createdAt --jq "[.[]|select(.createdAt|startswith(\"$(date -u +%Y-%m-%d)\"))]|length")
          echo "skipped=$skipped runs_today=$today"
          if [ "$skipped" -gt 0 ] && [ "$today" -lt 8 ]; then gh workflow run branchsweep.yml --ref main; fi
