name: fleet
# budget: ~3 min per run, once per day plus manual dispatch
# trigger: daily (never faster); the Cloudflare tick Worker may also dispatch it with repository_dispatch `ultrastable-tick`
# free-alternative: `python3 -m foundation queue --run --apply && python3 -m foundation fleet --apply` from a cloud-hosted Claude routine
# CLOSED-LOOP-AXIOM: one queue, one merge lane and one drift loop across every org repository; residual items are probed until they pass.
on:
  schedule:
    - cron: "41 5 * * *"
  repository_dispatch:
    types: [ultrastable-tick]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  id-token: write  # MAIN-WRITER-1: tools/push_main.py presents the run's OIDC token
concurrency:
  group: fleet
  cancel-in-progress: false
jobs:
  fleet:
    if: ${{ vars.HALT != '1' }}  # HALT-1: the owner's halt (repository variable HALT=1) stops every job
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0  # BRANCH-SWEEP-4: the PORT-BRANCH probes compare an archived branch with main and need the merge base
      - run: python3 scripts/actions_guard.py fleet
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Queue probes (close residual items whose probe passes)
        run: python3 -m foundation queue --run --apply --publish
        env:
          GH_TOKEN: ${{ secrets.FLEET_TOKEN || secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
      - name: Land item verdicts on main (QUEUE-PERSIST-1)
        # The closes, reopens and vacuous marks above were written only into this runner's checkout and lost when it ended
        # (17 items decided close on 2026-11-19 stayed open on main). They go to main through the App writer like every data commit.
        run: |
          git config user.name ultrastable-queue; git config user.email queue@users.noreply.github.com
          git checkout -- ops/contracts.jsonl 2>/dev/null || true
          python3 -m foundation balance --run --apply  # SELFTEST-1: only --gate ran, so /balance froze at 2026-11-21; the measure pass rebuilds it daily
          python3 -m foundation balance --gate --apply  # FLOW-BALANCE-1: the one filing gate before any item lands
          if [ -f ops/balance-held.jsonl ]; then git add ops/balance-held.jsonl; fi
          git add docs/issues ops/balance.json site/balance-data.js
          if git diff --cached --quiet; then echo "no item changed state"; exit 0; fi
          git commit -qm "queue: closing-probe verdicts for $(git diff --cached --name-only | wc -l) item(s) (QUEUE-PERSIST-1)"
          python3 tools/push_main.py
      - name: Cross-repo merge lane and drift loop
        run: python3 -m foundation fleet --apply
        env:
          FLEET_TOKEN: ${{ secrets.FLEET_TOKEN }}
          LANE_PAT: ${{ secrets.LANE_PAT }}
          GH_TOKEN: ${{ github.token }}
      - name: Closed-loop check
        run: python3 -m foundation closedloop --check
      - name: Mirror the queue onto GitHub Issues, labels and milestones (GH-MIRROR-1)
        if: ${{ !cancelled() }}
        run: python3 -m foundation ghmirror --apply --max 150
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Retriage gaps on the fleet clock (SLA-ISSUE-1; its own cron is weekly, so the rolling gap issue sat open for days)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: bash scripts/retriage.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Org profile probe on the fleet clock (SLA-ISSUE-1; closes its own issue when the page shows the profile)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: bash scripts/org_profile_probe.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Oldest open issue and PR inside 8 hours (SLA-8H-1)
        if: ${{ !cancelled() }}
        run: python3 -m foundation agewatch --check
        env:
          GH_TOKEN: ${{ secrets.FLEET_TOKEN || secrets.LANE_PAT || github.token }}
