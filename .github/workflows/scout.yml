name: scout
# budget: ~2 min x 4/month
# trigger: weekly; releases and posts of the leading agent platforms move over days, so a faster event buys nothing; dispatch on demand; second route: the watchdog dispatches this workflow when no run has succeeded for 1.5 intervals (doctrine/clocks.json `scout`: beat success)
# free-alternative: a cloud-hosted agent session runs `python3 -m foundation scout --run --apply`
on:
  schedule: [{cron: "23 6 * * 2"}]
  workflow_dispatch: {}
permissions: {id-token: write, contents: write, actions: write, models: read}
concurrency: {group: scout, cancel-in-progress: false}
jobs:
  scout:
    if: ${{ vars.HALT != '1' }}  # HALT-1: the owner's halt (repository variable HALT=1) stops every job
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Budget kill switch
        env: {GH_TOKEN: "${{ github.token }}"}
        run: python3 scripts/actions_guard.py scout
      - name: Scout the state of the art (SCOUT-1)
        run: python3 -m foundation scout --run --apply
      - name: Product-manager R&D pass (RND-1, competitor profiles, gaps, experiments, adoption)
        run: python3 -m foundation rnd --run --apply
      - name: Research pass (RESEARCH-1, intake, measurements, experiments, white papers)
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        run: |
          python3 -m foundation research --refresh-prs
          python3 -m foundation research --intake --apply
          python3 -m foundation research --run --apply
      - name: Ashby's journal index read live (ASHBY-KERNEL-1, the share of its keywords bound to code; a cited anchor the index no longer has turns the run red)
        if: ${{ !cancelled() }}
        run: python3 -m foundation ashbymap --live
      - name: Ashby archive pass (ASHBY-ARCHIVE-1; the archive answers, pending keywords and unbuilt principles become items)
        run: |
          python3 -m foundation ashbyarchive --live
          python3 -m foundation ashbyarchive --run --apply
      - name: Idea bank (WORLDWIDE-1 probes every data source; GROW-1 adds one new idea through every gate)
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        run: python3 scripts/build_idea_bank.py --live --grow
      - name: Commit findings, state and the pass log
        # SCOUT-COMMIT-1: runs when an earlier step failed too. On 2026-11-24 the idea-bank step exited 1 after the scout and R&D passes had finished,
        # this step was skipped and a week of findings was discarded. The failed step still turns the run red; what the other steps wrote is kept.
        if: ${{ !cancelled() }}
        run: |
          git config user.name "ultrastable-scout"; git config user.email "actions@users.noreply.github.com"
          python3 -m foundation balance --gate --apply  # FLOW-BALANCE-1: the one filing gate before any item lands
          if [ -f ops/balance-held.jsonl ]; then git add ops/balance-held.jsonl; fi
          git add doctrine/idea-bank.json site/idea-bank-data.js docs/issues ops/scout ops/rnd ops/research research/papers site/research-data.js
          # OPEN-STANDARDS-1: a bot commit lands with [skip ci], so the standards check runs here, before the commit; a ledger line that is not a CloudEvent
          # must not reach main, where it turns every pull request's foundation job red (ops/research/outcomes.jsonl did on 2026-11-28).
          python3 -m foundation openstd --check
          git diff --cached --quiet || { git commit -m "scout: weekly scout and rnd pass, findings filed, profiles refreshed, sources re-weighted"; python3 tools/push_main.py; }
