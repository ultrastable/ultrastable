# HOSTSYNC-1: repository <-> host reconciliation. Authenticates to the host with this run's GitHub OIDC token (no stored secret).
# budget: about 1 minute per run; runs after a deploy workflow finishes, on a host callback, and once a day.
# trigger: workflow_run of the deploy workflows, repository_dispatch host-changed (the callback a host or its webhook can send), daily cron as the fallback; never faster than daily on a timer.
# free-alternative: the same tools/hostsync.mjs can run from the tick Worker's cron against the gateway; no minutes needed.
name: host-sync
on:
  workflow_run: { workflows: [deploy-gateway], types: [completed] }
  repository_dispatch: { types: [host-changed] }
  schedule: [{ cron: "17 5 * * *" }]
  workflow_dispatch: {}
concurrency: { group: host-sync, cancel-in-progress: false }
permissions: { contents: write, id-token: write, actions: write }
jobs:
  sync:
    if: ${{ vars.HALT != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - run: node --test workers/core/hostsync/hostsync.test.js
      - name: reconcile the host with the repository
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: node workers/tools/hostsync.mjs run --declared deploy/hosting.json
      - name: write the runtime state back to the repository
        run: bash workers/tools/hostsync_commit.sh 'host-sync - runtime state of the host (HOSTSYNC-1)'
