name: platform-core
on:
  pull_request: { paths: ["platform/core/**"] }
  push: { branches: [main], paths: ["platform/core/**"] }
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: platform/core } }
    strategy: { matrix: { python: ["3.11", "3.12", "3.13"] } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m unittest discover -s tests -v
      - run: python -m ultrastable --db /tmp/ci.db demo --ticks 30
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t ultrastable-core:ci platform/core
  postgres:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: platform/core } }
    services:
      pg:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install "psycopg[binary]"
      - run: python -m unittest tests.test_pg_store -v
