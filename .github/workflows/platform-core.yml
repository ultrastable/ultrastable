name: platform-core
# budget: ~3 min per ready PR touching platform/core (one job, one Python version, no matrix)
# trigger: pull_request on platform/core/** only; main is already tested via the PR
# free-alternative: run `python -m unittest discover -s tests` in the agent session before opening the PR
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["platform/core/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    if: ${{ vars.HALT != '1' && (github.event.pull_request.draft != true) }}  # HALT-1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: platform/core } }
    services:
      pg:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: platform/core/pyproject.toml }
      - run: pip install "psycopg[binary]"
      - run: python -m unittest discover -s tests -v
      - run: python -m ultrastable --db /tmp/ci.db demo --ticks 30
