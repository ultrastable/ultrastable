name: transparency
# budget: ~0.5 min x 1 per day = ~15 min per month
# trigger: daily schedule and manual dispatch; the public /live snapshot may lag a merge by up to a day (launch passes refresh it sooner)
# free-alternative: `python3 -m foundation transparency --publish` from any launch host (loops.json loop transparency) or the Cloudflare tick worker
# Rebuilds the read-only snapshot behind ultrastable.io/live and upserts it into D1 (foundation/transparency.py). No write path, no repo changes.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  actions: read
  id-token: write  # LIVE-FRESH-2: OIDC route to the site worker, no stored credential
concurrency:
  group: transparency
  cancel-in-progress: true
jobs:
  publish:
    if: ${{ vars.HALT != '1' }}  # HALT-1: the owner's halt (repository variable HALT=1) stops every job
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 60
      - run: python3 scripts/actions_guard.py transparency
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python3 -m foundation transparency --publish
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Merged count on /live matches GitHub (LIVE-COUNT-1)
        run: sleep 20 && python3 -m foundation transparency --probe-merged
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Freshness probe (FRONT-BACKED-1)
        run: |
          sleep 20
          curl -fsS --retry 3 --retry-delay 10 https://ultrastable.io/api/freshness
