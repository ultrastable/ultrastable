name: issues
# budget: ~1 min x 30/month
# trigger: daily SLA sweep and triage of opened issues
# free-alternative: Cloudflare cron worker calling the REST API
# Triage on open and hourly, SLA sweep hourly. See docs/AUTOMATION.md.
on:
  issues:
    types: [opened]
  schedule:
    - cron: "5 6 * * *"
  workflow_dispatch:
permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write
concurrency:
  group: issues
  cancel-in-progress: false
jobs:
  # RULE-OF-TWO-2 (kernel 9.0.0 X1): anyone can open an issue, so the job that the `issues` event starts holds no secret: it triages with the
  # built-in token only. The scheduled sweep, which no outsider can start, keeps the lane token.
  triage-opened:
    if: ${{ vars.HALT != '1' && github.event_name == 'issues' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - name: Budget kill switch
        env: {GH_TOKEN: "${{ github.token }}"}
        run: python3 scripts/actions_guard.py issues
      - name: Triage
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/triage.sh
  sweep:
    if: ${{ vars.HALT != '1' && github.event_name != 'issues' }}  # HALT-1: the owner's halt (repository variable HALT=1) stops every job
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - name: Budget kill switch
        env: {GH_TOKEN: "${{ github.token }}"}
        run: python3 scripts/actions_guard.py issues
      - name: Mirror the queue onto GitHub Issues, labels and milestones (GH-MIRROR-1)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m foundation ghmirror --apply --max 150
      - name: Triage
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
        run: bash scripts/triage.sh
      - name: SLA sweep
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
        run: bash scripts/sla.sh
      - name: Scoreboard
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
        run: bash scripts/metrics.sh
      - name: CLOSED-LOOP-1 backlog (orphan artifacts and human-wait states to zero; the executor loop drains the issue)
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
        run: python3 -m foundation orphans --sync-issue "${{ github.repository }}"
