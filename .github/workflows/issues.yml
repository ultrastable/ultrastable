name: issues
# budget: ~1 min x 30/month
# trigger: daily SLA sweep and triage of opened issues
# free-alternative: Cloudflare cron worker calling the REST API
# Triage on open and hourly, SLA sweep hourly. See docs/AUTOMATION.md.
on:
  issues:
    types: [opened]
  schedule:
    - cron: "5 6 * * *"
  workflow_dispatch:
    inputs:
      issue:
        description: issue number handed over by the Worker lane (seed/worker/src/lane.js)
        required: false
permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write
concurrency:
  group: issues
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Budget kill switch
        env: {GH_TOKEN: "${{ github.token }}"}
        run: python3 scripts/actions_guard.py issues
      - name: Triage
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
        run: bash scripts/triage.sh
      - name: SLA sweep
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
        run: bash scripts/sla.sh
      - name: Scoreboard
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
        run: bash scripts/metrics.sh
