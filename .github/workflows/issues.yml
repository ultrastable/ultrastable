name: issues
# Triage on open and hourly, SLA sweep hourly. See docs/AUTOMATION.md.
on:
  issues:
    types: [opened, reopened]
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: write
concurrency:
  group: issues
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Triage
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
        run: bash scripts/triage.sh
      - name: SLA sweep
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
        run: bash scripts/sla.sh
