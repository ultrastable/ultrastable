name: ciwatch
# CIWATCH-1: the system watches its own red X's. Scans every watched repository's default-branch runs, reruns transient failures once, files a Q-CIFAIL item (probe included) for the rest; the executor (code agent) fixes them.
# budget: ~1 min per run, free (public repositories); ~30 scheduled runs a month plus one per failed workflow completion
# trigger: daily fallback, and a completed checks, lane or deploy run (a red X is noticed within minutes of appearing, gated by the concurrency group)
# free-alternative: `python3 -m foundation ciwatch --run --apply` from a cloud-hosted agent session or the Cloudflare cron worker
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_run:
    workflows: [checks, lane, deploy-site, deploy-workers, deploy-ultrastable, executor]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write  # CIWATCH-2: the item PR is opened with the built-in token when LANE_PAT is not bound (was: GraphQL 'Resource not accessible by integration')
  actions: write
  id-token: write  # MAIN-WRITER-1: tools/push_main.py presents the run's OIDC token
concurrency:
  group: ciwatch
  cancel-in-progress: false
jobs:
  ciwatch:
    if: ${{ vars.HALT != '1' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure') }}  # HALT-1: the owner's halt stops every job
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - run: python3 scripts/actions_guard.py ciwatch
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python3 -m foundation ciwatch --run --apply
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
      - name: Ledger to the evidence branch; new items to a PR the lane merges
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ultrastable-ciwatch"
          git config user.email "actions@users.noreply.github.com"
          git add ops/ciwatch.jsonl
          # PUSH-RETRY-1: GitHub answered 500 on this push (run 45649056299) and the whole pass failed; three tries with backoff, then fail loudly
          git diff --cached --quiet || { git commit -q -m "ciwatch: ledger"; for i in 1 2 3; do git push -q origin HEAD:refs/heads/ciwatch-evidence --force && break; [ "$i" = 3 ] && exit 1; sleep $((i*10)); done; }
          git reset -q --hard origin/main
          python3 -m foundation ciwatch --run --apply > /dev/null
          git checkout -q -- ops/ciwatch.jsonl
          python3 scripts/land_data.py "ciwatch: file failing-workflow items (CIWATCH-1)" docs/issues  # CIWATCH-4: items land through the main writer; a pull request opened with the built-in token never got its checks and stayed open
      - name: Repair a red deploy gate with the smallest revert (REDMAIN-1, no model involved)
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git checkout -q -f main && git reset -q --hard origin/main
          open=$(gh api "repos/${{ github.repository }}/pulls?state=open&per_page=100" --jq '[.[]|select(.head.ref|startswith("agent/redmain-"))]|length')
          if [ "${open:-0}" != "0" ]; then echo "a redmain repair PR is already open"; exit 0; fi
          python3 -m foundation redmain --run --apply | tee "$RUNNER_TEMP/redmain.json"
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            b="agent/redmain-${GITHUB_RUN_ID}"
            git config user.name "ultrastable-ciwatch"; git config user.email "actions@users.noreply.github.com"
            git checkout -q -b "$b"; git commit -q -am "redmain: revert the change that turned a deploy gate red (REDMAIN-1)"
            git push -q origin "$b"
            gh api "repos/${{ github.repository }}/pulls" -f base=main -f head="$b" -f title="redmain: repair a red deploy gate" -f body="REDMAIN-1: the gate was red on main; this is the smallest revert that turns it green, found by foundation/redmain.py. The lane merges it on green checks." --jq .html_url
            gh workflow run checks.yml --ref "$b" || echo "::warning::checks dispatch failed; the lane picks the PR up on its next run"
            git checkout -q -f main
          fi
      - name: Reconcile PRs stuck in conflict with main (UNSTICK-1)
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
        run: git reset -q --hard origin/main && ./scripts/unstick_prs.sh
