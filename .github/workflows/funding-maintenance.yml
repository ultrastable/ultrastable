name: funding-maintenance
# budget: ~5 min x 4/month
# trigger: weekly registry re-check (needs open network)
# free-alternative: Cloudflare cron worker with fetch
# Weekly re-verification of business/funding/registry.json. See business/funding/MAINTENANCE.md.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
permissions:
  actions: write
  contents: read
  issues: write
concurrency:
  group: funding-maintenance
  cancel-in-progress: false
jobs:
  verify:
    if: ${{ vars.HALT != '1' }}  # HALT-1: the owner's halt (repository variable HALT=1) stops every job
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Budget kill switch
        env: {GH_TOKEN: "${{ github.token }}"}
        run: python3 scripts/actions_guard.py funding-maintenance
      - name: Verify registry
        run: python3 scripts/funding_verify.py --fetch --out report.json
      - name: Validate application packets and refresh tracker
        run: python3 scripts/test_funding_packet.py && python3 scripts/funding_packet.py
      - name: File or update issues
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
        run: python3 scripts/funding_file_issues.py report.json
      - name: Open a PR for queued findings (Issues are off)
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git status --porcelain docs/issues | grep -q . || { echo "no queued findings"; exit 0; }
          br="agent/funding-findings-$(date -u +%Y%m%d)"
          git checkout -B "$br"; git add docs/issues
          git -c user.name=ultrastable-ops -c user.email=actions@users.noreply.github.com commit -m "Funding findings queued"
          git push -f -u origin "$br"
          { echo "Queue items from funding_verify.py. Closed by the executor."; echo; echo "## Self-audit"; echo "Real output: $(git diff --stat HEAD~1 | tail -1)"; echo "Not thinking about: findings that clear on their own leave a stale item until the executor closes it."; echo "Fix: closed by the executor with evidence."; } > pr-body.md
          gh pr create --base main --head "$br" --title "Funding findings queued" --body-file pr-body.md || gh pr list --head "$br" --json url --jq '.[0].url'
