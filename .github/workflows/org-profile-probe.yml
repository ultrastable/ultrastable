name: org-profile-probe
# budget: ~1 min x 4/month
# trigger: weekly probe
# free-alternative: curl from the Cloudflare cron worker
# BG-13: "done" means the public org page renders the profile. Daily + on demand.
on:
  schedule: [{ cron: "23 6 * * 1" }]
  workflow_dispatch:
permissions:
  issues: write
  contents: read
concurrency: {group: org-profile-probe, cancel-in-progress: true}
jobs:
  probe:
    if: ${{ vars.HALT != '1' }}  # HALT-1: the owner's halt (repository variable HALT=1) stops every job
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ORG: ${{ github.repository_owner }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Org page shows the profile
        run: |
          title="org-profile-probe: public org page missing profile"
          # the phrase is the profile's own heading (profile/README.md in ultrastable/.github); the old phrase was removed from the profile on 11-23
          if page=$(curl -fsSL "https://github.com/$ORG") && echo "$page" | grep -qi "foundation for any autonomous system"; then
            echo "ok: profile live"
            for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[].number'); do
              gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "Closing probe passed: https://github.com/$ORG shows the profile."
            done
            exit 0
          fi
          echo "::error::https://github.com/$ORG does not show the profile"
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          [ -n "$n" ] || gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "Probe failed. Owner: org-init. Check .github is unarchived+public and profile/README.md exists. Closing probe: this workflow passes."
          exit 1
