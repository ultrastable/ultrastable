name: executor
# budget: ~5 min per run, up to doctrine/clocks.json chain.max_runs_per_day (4) plus the daily cron and Worker dispatches (the Worker dispatches only when GITHUB_DISPATCH_TOKEN is bound; guard below)
# trigger: daily fallback (GitHub's scheduler has fired 5 times in 1011 runs, so it cannot be the only spark), a finished lane or site deploy (EXEC-SPARK-1: every merge looks for the next item, gated by the chain caps), repository_dispatch `ultrastable-tick` from the Cloudflare tick Worker, and manual dispatch
# free-alternative: the same command from the cloud-hosted Claude routine: `python3 -m foundation executor --pick` and `--record` (no model key needed)
# The agent-executor step of the tick: picks the top open issue in driver order, claims it, changes, checks, opens a PR; the lane merges on green.
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_run:
    workflows: [lane, deploy-site]
    types: [completed]
  repository_dispatch:
    types: [ultrastable-tick]
  workflow_dispatch:
    inputs:
      issue:
        description: "issue number to work (default, top of driver order)"
        required: false
concurrency:  # per run: the executor job holds the real `executor` group (SPARK-QUEUE-1)
  group: executor-run-${{ github.run_id }}
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  id-token: write  # AI-OIDC-1: Workers AI through the site Worker's /__internal/cf route; the repo's Cloudflare secrets name the retired account
jobs:
  # SPARK-QUEUE-1: the chain cap is decided outside the executor's concurrency group, so a capped spark never displaces a queued dispatch (measured 2026-11-17: capped workflow_run sparks cancelled manual and Worker dispatches)
  spark:
    if: ${{ vars.HALT != '1' }}  # HALT-1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      go: ${{ steps.spark.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - name: Spark gate (EXEC-SPARK-1)
        id: spark
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            python3 -m foundation clock --chain | tee spark.json
            python3 -c "import json;print('go=' + str(json.load(open('spark.json')).get('chain', False)).lower())" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
  executor:
    needs: spark
    if: ${{ vars.HALT != '1' && needs.spark.outputs.go == 'true' }}  # HALT-1: the owner's halt (repository variable HALT=1) stops every job
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    concurrency:
      group: executor
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - run: python3 scripts/actions_guard.py executor
        env:
          GH_TOKEN: ${{ github.token }}
      - run: pip install pyyaml
      - name: Gate and feed the agent (budget caps, kill switch, Q-UNK work)
        id: work
        if: needs.spark.outputs.go == 'true'
        run: python3 -m foundation agentwork --apply
        env:
          HALT: ${{ vars.HALT }}
          AGENT_KILL: ${{ vars.AGENT_KILL }}
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
      - name: Bridge parked needs-code items into the queue (NEEDS-CODE-BRIDGE-1)
        if: needs.spark.outputs.go == 'true'
        run: python3 scripts/needs_code_bridge.py
      - name: Sense code signals and trusted issues, file self-code items (SELFCODE-1)
        if: needs.spark.outputs.go == 'true' && steps.work.outputs.agent_go != 'false'
        run: python3 -m foundation selfcode --sense --apply
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Execute one item
        if: needs.spark.outputs.go == 'true' && steps.work.outputs.agent_go != 'false'
        run: ULTRASTABLE_HOST="github-actions:${{ github.event_name }}" python3 -m foundation executor --apply ${{ inputs.issue && format('--issue {0}', inputs.issue) || '' }}
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Settle merged agent changes against their signal and revert a regression (SELFCODE-1)
        if: always() && needs.spark.outputs.go == 'true'
        run: python3 -m foundation selfcode --settle --apply
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
      - name: Commit provenance to loop-evidence
        if: always() && needs.spark.outputs.go == 'true'
        run: bash scripts/executor_evidence.sh
      - name: Keep the clock ticking (CLOCKWORK-1)
        if: always() && needs.spark.outputs.go == 'true'
        run: python3 -m foundation clock --chain --apply
        env:
          GH_TOKEN: ${{ github.token }}
      - name: "Heal the clocks (CLOCKWORK-2: catch-up, settlement, escalation)"
        if: always() && needs.spark.outputs.go == 'true'
        run: python3 -m foundation clock --heal --apply
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
