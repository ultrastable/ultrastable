name: executor
# budget: ~5 min per run, up to doctrine/clocks.json chain.max_runs_per_day (4) plus the daily cron and Worker dispatches (the Worker dispatches only when GITHUB_DISPATCH_TOKEN is bound; guard below)
# trigger: daily fallback, repository_dispatch `ultrastable-tick` from the Cloudflare tick Worker, and manual dispatch
# free-alternative: the same command from the cloud-hosted Claude routine: `python3 -m foundation executor --pick` and `--record` (no model key needed)
# The agent-executor step of the tick: picks the top open issue in driver order, claims it, changes, checks, opens a PR; the lane merges on green.
on:
  schedule:
    - cron: "23 6 * * *"
  repository_dispatch:
    types: [ultrastable-tick]
  workflow_dispatch:
    inputs:
      issue:
        description: "issue number to work (default, top of driver order)"
        required: false
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
concurrency:
  group: executor
  cancel-in-progress: false
jobs:
  executor:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - run: python3 scripts/actions_guard.py executor
        env:
          GH_TOKEN: ${{ github.token }}
      - run: pip install pyyaml
      - name: Execute one item
        run: ULTRASTABLE_HOST="github-actions:${{ github.event_name }}" python3 -m foundation executor --apply ${{ inputs.issue && format('--issue {0}', inputs.issue) || '' }}
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Commit provenance to loop-evidence
        if: always()
        run: bash scripts/executor_evidence.sh
      - name: Keep the clock ticking (CLOCKWORK-1)
        if: always()
        run: python3 -m foundation clock --chain --apply
        env:
          GH_TOKEN: ${{ github.token }}
      - name: "Heal the clocks (CLOCKWORK-2: catch-up, settlement, escalation)"
        if: always()
        run: python3 -m foundation clock --heal --apply
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
