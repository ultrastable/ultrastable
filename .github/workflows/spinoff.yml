name: spinoff
# SPINOFF-1: the portfolio loop of spun-off apps. Collects each live app's public aggregate metrics, scores measured value, keeps, iterates, promotes or retires, and launches the next best ideas up to the daily count the free-tier governor level allows (SPINOFF-IDEAS-1).
# budget: ~1 min per run, free (public repository); 1 scheduled run a day
# trigger: daily; the clock stays daily and the loop fills the day instead: up to 3 launches per run when the governor level is ok, 1 at degrade, 0 at shed
# free-alternative: `python3 -m foundation spinoff --collect --apply && python3 -m foundation spinoff --tick --apply` from a cloud-hosted agent session or the Cloudflare cron worker
on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  id-token: write  # SPINOFF-DEPLOY-2: deploy-oidc.mjs presents this run's OIDC token to ultrastable-site
concurrency:
  group: spinoff
  cancel-in-progress: false
jobs:
  spinoff:
    if: ${{ vars.HALT != '1' }}  # HALT-1: the owner's halt stops every job
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - name: Free-tier headroom, then ideas (SPINOFF-IDEAS-1)
        env:
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 -m foundation ideas --headroom --apply
          python3 -m foundation ideas --brainstorm --apply
      - run: python3 -m foundation spinoff --collect --apply
      - run: python3 -m foundation spinoff --tick --apply
      - name: Launch up to the governor's daily count
        run: |
          for i in 1 2 3; do python3 -m foundation spinoff --launch --apply; done
      - run: python3 -m foundation spinoff --rebuild
      - run: python3 -m foundation ideas --roadmap --apply
      - run: python3 -m foundation spinoff --promote --apply
      - name: Test the data before it can reach main (SPINOFF-DATA-GATE-1)
        # A bot data PR gets no check run of its own, so a snapshot that breaks a suite reached main and turned it red (#2765, 2026-11-27). The consistency
        # checks and the two suites that read this data run here, on the files the loop just wrote; a failure stops the run before any PR opens.
        run: |
          python3 -m foundation ideas --check
          python3 -m foundation spinoff --check
          python3 -m unittest discover -s tests/foundation -p "test_ideas.py"
          python3 -m unittest discover -s tests/foundation -p "test_spinoff.py"
      - name: Ledgers and registry to a PR the lane merges
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ultrastable-spinoff"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain ops instances spinoffs site docs)" ]; then
            b="agent/spinoff-${GITHUB_RUN_ID}"
            python3 -m foundation balance --gate --apply  # FLOW-BALANCE-1: the one filing gate before any item lands
            if [ -f ops/balance-held.jsonl ]; then git add ops/balance-held.jsonl; fi
            git checkout -q -b "$b"; git add ops instances spinoffs site/spinoff-roadmap-data.js docs/issues
            git commit -q -m "spinoff: metrics, portfolio decisions and launches (SPINOFF-1)"
            git push -q origin "$b"
            gh pr create --base main --head "$b" --title "spinoff: portfolio tick" --body "Metrics, decisions and launches recorded by the SPINOFF-1 loop. Evidence: ops/spinoff/ledger.jsonl."
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: {node-version: 24}
      - name: Deploy the spinoffs Worker from main through the OIDC route and probe every app (SPINOFF-DEPLOY-2)
        # SPINOFF-DEPLOY-2: the wrangler step here used the repository's CLOUDFLARE_* secrets, which name the retired account (SINGLE-ACCOUNT-2),
        # and a D1 id that only exists there, so it failed every day from 2026-11-21. The worker is now in doctrine/topology.json and deploys
        # like every platform worker: this run's OIDC token, verified by ultrastable-site, uploads main's bundle; the registry PR above
        # redeploys through deploy-ultrastable.yml (path spinoffs/**) when the lane merges it.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node deploy/deploy-oidc.mjs ultrastable-spinoffs
          python3 scripts/probe_spinoffs.py
