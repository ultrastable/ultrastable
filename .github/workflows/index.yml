name: index
on:
  schedule: [{cron: "17 * * * *"}]
  issues: {types: [opened, edited, closed, reopened, deleted, assigned, unassigned]}
  workflow_dispatch: {}
permissions: {contents: write, issues: read}
concurrency: {group: index, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/build_index.py
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
      - run: python3 qnfo-platform-thread/verify.py
      - name: Commit if changed
        run: |
          git config user.name "ultrastable-index"; git config user.email "actions@users.noreply.github.com"
          git add docs/ISSUES-BY-AREA.md docs/ip/IP-REGISTER.md
          git diff --cached --quiet || { git commit -m "index: refresh issues-by-area and IP register from issues"; git push; }
