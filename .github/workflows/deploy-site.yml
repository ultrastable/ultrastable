name: deploy-site
# trigger: push to main touching the site or its deploy inputs, plus manual workflow_dispatch; skipped unless DEPLOY_SITE_ENABLED is true
# free-alternative: run `node deploy/deploy-site.mjs` from a cloud-hosted agent session with a Cloudflare token (docs/ops/SITE-DEPLOY.md)
# budget: ~1 min per run, only on site changes, 5 min timeout
# Deploys site/worker.js and attaches ultrastable.io/.app/.net (deploy/deploy-site.mjs).
# Closes the loop (merge -> deploy -> live-version verify). Path-filtered so it costs about 1 minute only when the site changes. Sessions can also deploy through the Cloudflare connector (docs/ops/SITE-DEPLOY.md); this workflow is the fallback once repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID exist.
on:
  push:
    branches: [main]
    paths: ["site/**", "seed/analytics/**", "deploy/deploy-site.mjs", ".github/workflows/deploy-site.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency: {group: deploy-site, cancel-in-progress: true}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ vars.HALT != '1' && (vars.DEPLOY_SITE_ENABLED == 'true') }}  # HALT-1
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: 22}
      - name: Site tests
        run: for t in site/*.test.mjs; do node "$t" || exit 1; done
      - name: Require credentials
        run: '[ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Cloudflare secrets not set (BG-25)"; exit 1; }'
      - name: Deploy
        run: |
          set -o pipefail
          node deploy/deploy-site.mjs | tee deploy.log
      - name: Verify live
        run: |
          # a skipped deploy (retired account; deploy-ultrastable.yml deploys and probes the ultrastable account) has nothing to verify here
          if grep -q '^skip:' deploy.log; then echo "deploy skipped on this account; deploy-ultrastable.yml owns the live deploy and its probe"; exit 0; fi
          sleep 10
          curl -fsSI https://ultrastable.io/social-card.png | grep -i 'content-type: image/png'
