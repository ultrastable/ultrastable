name: deploy-site
# Deploys site/worker.js and attaches ultrastable.io/.app/.net (deploy/deploy-site.mjs).
# Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Without them the run is red with an explicit message (BG-25).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [site/worker.js, deploy/deploy-site.mjs]
permissions:
  contents: read
concurrency: {group: deploy-site, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Site tests
        run: node site/site.test.mjs
      - name: Require credentials
        run: '[ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Cloudflare secrets not set (BG-25)"; exit 1; }'
      - name: Deploy
        run: node deploy/deploy-site.mjs
      - name: Verify live
        run: |
          sleep 10
          curl -fsSI https://ultrastable.io/social-card.png | grep -i 'content-type: image/png'
