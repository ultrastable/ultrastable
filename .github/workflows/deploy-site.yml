name: deploy-site
# budget: ~1 min per run, manual only, 5 min timeout
# Deploys site/worker.js and attaches ultrastable.io/.app/.net (deploy/deploy-site.mjs).
# Manual only: GitHub Actions minutes on private repos are budgeted (about 1 minute per run). Sessions deploy through the Cloudflare connector (docs/ops/SITE-DEPLOY.md); this workflow is the fallback once repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID exist.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency: {group: deploy-site, cancel-in-progress: true}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ vars.DEPLOY_SITE_ENABLED == 'true' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: 22}
      - name: Site tests
        run: node site/site.test.mjs
      - name: Require credentials
        run: '[ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Cloudflare secrets not set (BG-25)"; exit 1; }'
      - name: Deploy
        run: node deploy/deploy-site.mjs
      - name: Verify live
        run: |
          sleep 10
          curl -fsSI https://ultrastable.io/social-card.png | grep -i 'content-type: image/png'
