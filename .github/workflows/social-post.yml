name: social-post
# budget: ~1 min x 30/month
# trigger: daily; caps in social/gate.json decide how many posts go out
# free-alternative: Cloudflare cron worker
# Publishes at most one guard-clean post per run. Dry-run until social/gate.json mode=live and channel secrets exist.
# Kill switch: social/gate.json "kill": true. Owner cards: docs/ops/SOCIAL-ACCOUNTS.md.
on:
  schedule:
    - cron: "17 15 * * *"
  workflow_dispatch:
permissions:
  id-token: write  # MAIN-WRITER-1: tools/push_main.py presents the run's OIDC token
  actions: write
  contents: write
concurrency:
  group: social-post
  cancel-in-progress: false
jobs:
  post:
    if: ${{ vars.HALT != '1' }}  # HALT-1: the owner's halt (repository variable HALT=1) stops every job
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - name: Budget kill switch
        env: {GH_TOKEN: "${{ github.token }}"}
        run: python3 scripts/actions_guard.py social-post
      - name: Refill calendar
        working-directory: scripts
        run: python3 social_generate.py
      - name: Thought leadership (white papers to posts with the Ultrastable hook, THOUGHT-1)
        run: python3 -m foundation thought --run --apply
      - name: Reach loop (events to posts, metrics, weights)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
        run: python3 -m foundation reach --run --apply
      - name: Post due item
        working-directory: scripts
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: python3 social_post.py
      - name: Record state
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          python3 -m foundation balance --gate --apply  # FLOW-BALANCE-1: the one filing gate before any item lands
          if [ -f ops/balance-held.jsonl ]; then git add ops/balance-held.jsonl; fi
          git add social/calendar.json ops/reach docs/issues site/feed-data.js  # FEED-FROZEN-1: the feed was regenerated every run and never committed
          if [ -d ops/thought ]; then git add ops/thought; fi
          if [ -f social/state.json ]; then git add social/state.json; fi
          if git diff --cached --quiet; then echo "no state change"; exit 0; fi
          git config user.name "ultrastable-social"; git config user.email "social@ultrastable.io"
          git commit -m "social: record post state"
          python3 tools/push_main.py || { echo "::error::state push failed; see docs/BOOTSTRAP-GAPS.md BG-25"; exit 1; }
