name: tenant-sync
# budget: ~1 min per day
# trigger: daily (TENANT-SYNC-1: drift between core and tenants is measured daily, never faster) and a push to workers/ so a core change reaches tenants the same day
# free-alternative: `python3 -m foundation.tenantsync --run --apply` from a Cloudflare cron worker or a cloud-hosted agent session
# Backend loop: clones each tenant, checks pins and unregistered generic code, opens a core PR (lift) or a tenant PR (re-vendor). Ledger: ops/tenant-sync/ledger.jsonl.
on:
  schedule:
    - cron: "23 6 * * *"
  push:
    branches: [main]
    paths: ["workers/**"]
  workflow_dispatch:
permissions:
  id-token: write  # MAIN-WRITER-1: tools/push_main.py presents the run's OIDC token
  contents: write
  pull-requests: write
concurrency:
  group: tenant-sync
  cancel-in-progress: false
jobs:
  sync:
    if: ${{ vars.HALT != '1' }}  # HALT-1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 scripts/actions_guard.py tenant-sync
        env: { GH_TOKEN: "${{ github.token }}" }
      - run: python3 -m foundation.tenantsync --check
      - name: Check, lift and re-vendor every tenant
        run: python3 -m foundation.tenantsync --run --apply
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
          LANE_PAT: ${{ secrets.LANE_PAT }}
      - name: Measure drift and upstream flow (SYNC-BOTH-WAYS-1)
        run: python3 -m foundation.tenantsync --metrics --apply
      - name: Record the ledger
        run: |
          git config user.name tenant-sync; git config user.email tenant-sync@users.noreply.github.com
          python3 -m foundation balance --gate --apply  # FLOW-BALANCE-1: the one filing gate before any item lands
          if [ -f ops/balance-held.jsonl ]; then git add ops/balance-held.jsonl; fi
          git add ops/tenant-sync/ledger.jsonl ops/tenant-sync/metrics.json docs/issues
          git diff --cached --quiet || (git commit -qm "tenant-sync: ledger" && python3 tools/push_main.py)
