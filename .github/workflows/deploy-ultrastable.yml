name: deploy-ultrastable
# DEPLOY-OIDC-1: merge -> deploy of every live platform worker into the ultrastable Cloudflare account, authenticated by this run's GitHub
# OIDC token (no stored Cloudflare secret; site/deployer.js verifies the token names this repository's main branch).
# budget: ~2 min per run, only when worker behaviour changes (SUBSTANCE-1: a push of regenerated data, ledgers or literal churn skips the deploy in ~20 s unless the live deploy is older than doctrine/substance.json deploy.max_age_hours)
# trigger: push to main on worker sources (tenant code still moving into its own repository included, FULLSTACK-1), and manual dispatch; never faster than the merge rate
# free-alternative: the tick's handoff loop deploys the same modules through the same endpoint (seed/worker/src/handoff.js) once it holds a GitHub credential
on:
  push:
    branches: [main]
    paths: ["seed/worker/**", "site/**", "dashboard/**", "doctrine/topology.json", "seed/autonomy/**", "seed/analytics/**", "instances/*/worker/**", "deploy/deploy-oidc.mjs", ".github/workflows/deploy-ultrastable.yml"]
  workflow_dispatch:
    inputs:
      workers:
        description: "comma-separated worker ids (empty: every live worker)"
        required: false
        default: ""
permissions:
  contents: write  # DEPLOY-RECORD-1: the record step commits ops/deploys.jsonl
  id-token: write
concurrency: {group: deploy-ultrastable, cancel-in-progress: false}
jobs:
  deploy:
    if: ${{ vars.HALT != '1' }}  # HALT-1: the owner's halt (repository variable HALT=1) stops every job
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Deploy only when behaviour changed (SUBSTANCE-1)
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 -m foundation substance --deploy-gate --range "${{ github.event.before }}..${{ github.sha }}" \
            --paths 'seed/worker/**' 'site/**' 'dashboard/**' 'doctrine/topology.json' 'seed/autonomy/**' 'seed/analytics/**' 'instances/*/worker/**' 'deploy/deploy-oidc.mjs' '.github/workflows/deploy-ultrastable.yml'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.gate.outputs.deploy == 'true'
        with: {node-version: 24}
      - name: Deploy through the ultrastable-site OIDC endpoint
        if: steps.gate.outputs.deploy == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node deploy/deploy-oidc.mjs "${{ inputs.workers }}"
      - name: Record the verified deploy (DEPLOY-RECORD-1)
        if: steps.gate.outputs.deploy == 'true'
        run: |
          git config user.name "ultrastable-bot"; git config user.email "bot@users.noreply.github.com"
          python3 -m foundation claims --fix --apply
          git add ops/deploys.jsonl README.md platform/adapters/README.md site/claims-data.js
          bash tools/record_main.sh "deploy-ultrastable: record live-verified deploy"
