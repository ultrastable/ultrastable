name: actions-budget
# budget: ~1 min x 4/month
# trigger: weekly estimate of Actions minutes against the free quota; pauses non-essential workflows near the limit
# free-alternative: none cheaper; this is the guard (run `python3 scripts/actions_budget.py` from a session with gh to see it any time)
on:
  schedule:
    - cron: "37 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: actions-budget
  cancel-in-progress: true
jobs:
  estimate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Estimate and pause when near the quota
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/actions_budget.py --pause
          cat actions-budget-report.md >> "$GITHUB_STEP_SUMMARY"
          git add actions-budget.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "ultrastable-budget"; git config user.email "budget@ultrastable.io"
          git commit -m "actions-budget: pause non-essential workflows (projected minutes near the free quota)"
          git push origin HEAD:main
