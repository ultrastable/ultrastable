name: org-settings
# Applies github/org-settings.json (org profile fields, repo description/homepage/topics, merge and
# security settings, main-branch protection). Needs ORG_ADMIN_TOKEN (docs/ops/ORG-TOKEN.md).
# Without the token the run is red with an explicit gate message; that is the recorded state of BG-22.
on:
  workflow_dispatch:
    inputs:
      mode: {description: "apply | probe", required: true, default: apply}
  push:
    branches: [main]
    paths: [github/org-settings.json, scripts/apply_github_settings.sh]
permissions:
  contents: read
concurrency: {group: org-settings, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Require token
        run: '[ -n "$GH_TOKEN" ] || { echo "::error::ORG_ADMIN_TOKEN not set: owner card in docs/BOOTSTRAP-GAPS.md (BG-22)"; exit 1; }'
      - name: Apply or probe
        run: bash scripts/apply_github_settings.sh "${{ inputs.mode || 'apply' }}"
