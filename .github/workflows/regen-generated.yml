name: regen-generated
# budget: ~1 min per merge to main, serialized
# trigger: push to main (REGEN-GENERATED-1: generated data goes stale whenever main moves, so it is refreshed after the merge, not by every PR); pushes that touch only the generated files are ignored so the bot never retriggers itself
# free-alternative: `python3 scripts/regen_generated.py` from a cloud-hosted agent session, or the tick Worker's lane
# Backend loop: runs every generator, commits the result to main when anything changed. PR checks still fail on real drift; this only heals main after a merge.
on:
  push:
    branches: [main]
    paths-ignore:
      - "doctrine/decision-ledger.json"
      - "ops/provenance.jsonl"
      - "doctrine/writeback/**"
      - "README.md"
      - "platform/adapters/README.md"
      - "site/claims-data.js"
      - "seed/SYSTEM.md"
      - "seed/docs/claims.json"
      - "seed/README.md"
      - "site/dashboard-data.js"
      - "site/self-data.js"
      - "site/trajectory-data.js"
      - "ops/trajectory.json"
      - "ops/trajectory.jsonl"
      - "site/ultrastability-data.js"
      - "site/decisions-data.js"
      - "site/research-data.js"
      - "research/papers/chen-stratton-2026.md"
      - "research/papers/ashby-1952.md"
      - "research/papers/open-loops-2026.md"
      - "research/papers/safety-by-limits-2026.md"
      - "social/calendar.json"
      - "ops/research/prs.json"
      - "ops/thought/log.jsonl"
      - "ops/decisions/outcomes.jsonl"
      - "ops/decisions/rescore.jsonl"
      - "ops/executor-log.jsonl"
      - "instances/ultrastable/own-database.json"
      - "docs/security/multi-tenant-controls.json"
      - "core-contract.json"
      - "doctrine/triggers.json"
      - "seed/self/SELF.md"
      - "seed/self/self.json"
  workflow_dispatch:
permissions:
  id-token: write  # MAIN-WRITER-1: tools/push_main.py presents the run's OIDC token
  contents: write
  pull-requests: read  # PR-OUTCOME-1
  models: read  # RESCORE-1: the held-out second model
concurrency:
  group: regen-generated
  cancel-in-progress: false
jobs:
  regen:
    if: ${{ vars.HALT != '1' }}  # HALT-1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 scripts/actions_guard.py regen-generated
        env: { GH_TOKEN: "${{ github.token }}" }
      - name: Regenerate every generated file
        env:  # RESCORE-1 grades with a second model through the run's own token; PR-OUTCOME-1 reads pull request states with it
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/regen_generated.py
      - name: Commit the regenerated data
        run: |
          git config user.name regen-generated; git config user.email regen-generated@users.noreply.github.com
          # REGEN-PUSH-1: main moves while this runs (merges, the lane, the watchdog), so a plain push was rejected as non-fast-forward (runs 12 and 13).
          # On rejection: restart from the new main, regenerate on it and push again. Never force.
          for try in 1 2 3 4; do
            git add -A
            git diff --cached --quiet && { echo "generated data already current"; exit 0; }
            git commit -qm "regen-generated: refresh generated data after merge (REGEN-GENERATED-1)"
            if python3 tools/push_main.py; then exit 0; fi
            echo "push rejected (try $try): main moved; regenerating on the new main"
            git fetch -q origin main && git reset -q --hard origin/main && python3 scripts/regen_generated.py
            sleep $((try * 3))
          done
          echo "::error::REGEN-PUSH-1: could not push regenerated data after 4 tries"; exit 1
