name: checks
# COST-ZERO-1: the steps that fail most often (measured over the last 25 failed runs: gaplint/demo tests, outreach tests, dashboard preview) run first, so a failing PR stops in seconds, not after the full run; 958 of 1218 minutes this month were failed runs
# budget: ~5 min per ready PR update (the folded-in workers/ tree lengthened the scan steps), cancel-in-progress
# trigger: PR gate; drafts skipped
# free-alternative: none needed; `scripts/lint_workflows.py` and the tests run in the cloud-hosted agent session first
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    if: ${{ vars.HALT != '1' && (github.event.pull_request.draft != true) }}  # HALT-1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Regenerate generated files and push them to the PR (REGEN-1)
        # self-heal: a count, ledger or dashboard that main moved under the PR is regenerated here instead of failing the freshness checks below;
        # on a same-repository PR the result is pushed back (LANE_PAT, so the push starts a fresh run), otherwise this run checks the regenerated tree
        env:
          LANE_PAT: ${{ secrets.LANE_PAT }}
          HEAD_REF: ${{ github.head_ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          ./scripts/regen_generated.sh
          if [ -n "$(git status --porcelain)" ] && [ "$SAME_REPO" = "true" ] && [ -n "$LANE_PAT" ] && [ -n "$HEAD_REF" ]; then
            git config user.name ultrastable-regen; git config user.email regen@users.noreply.github.com
            git add -A && git commit -m "REGEN-1: regenerate generated files" && git push "https://x-access-token:${LANE_PAT}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/${HEAD_REF}"
          fi
      - name: Workflow minute-budget lint (cheap, runs first)
        run: python3 scripts/lint_workflows.py
      - name: Workflow YAML parses
        run: python3 -c "import yaml,glob; [yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml')]"
      - name: Outreach engine tests
        working-directory: scripts
        run: python3 test_outreach.py
      - name: Dashboard preview is computed from the repository
        run: python3 scripts/build_dashboard.py --check
      - name: Product and demo tests, gaplint on this repo (no extra workflow; runs on PRs only)
        run: |
          (cd products/gaplint && python3 -m unittest discover -s tests)
          PYTHONPATH=products/gaplint python3 -m gaplint .
          node --test demos/test/*.test.mjs
          node --test test/cost-probe.test.mjs
          node --test test/plan-limits.test.mjs
          node --test --no-warnings dashboard/test/*.test.mjs
          bash scripts/site_tests.sh  # GATE-PARITY-1: runs site/*.test.mjs, the gate deploy-site runs before it deploys
      - name: Secret and key scan
        run: |
          if grep -rEIl --exclude-dir=.git -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' -e 'gh[pousr]_[A-Za-z0-9]{36,}' -e 'AKIA[0-9A-Z]{16}' -e 'sk-ant-[A-Za-z0-9_-]{20,}' .; then echo "secret-like content found"; exit 1; fi
      - name: No oversize files
        run: |
          big=$(find . -path ./.git -prune -o -type f -size +25M -print)
          [ -z "$big" ] || { echo "files over 25MB: $big"; exit 1; }
      - name: Repo verify
        run: |
      - name: Social guard tests
        working-directory: scripts
        run: python3 test_social.py
      - name: Demo video narration guard
        run: python3 scripts/video_build.py --check
      - name: LLM review tests
        working-directory: scripts
        run: python3 -m unittest test_llm_review
      - name: Seed tests
        working-directory: seed
        run: python3 -m unittest discover -s tests
      - name: Plugin tier (boundary lint, self-description drift, plugin and sender tests)
        working-directory: seed
        run: |
          python3 -m plugins check
          python3 -m plugins self --check
          python3 -m unittest discover -s plugins/tests -t .
          node --test plugins/email/worker/sender.test.mjs
  foundation:
    if: ${{ vars.HALT != '1' && (github.event.pull_request.draft != true) }}  # HALT-1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Regenerate generated files locally (REGEN-1; the push is done by the fast job only)
        run: ./scripts/regen_generated.sh
      - name: Doctrine check (positioning and code-is-the-only-memory, from doctrine/positioning.json)
        run: python3 -m foundation doctrine --check
      - name: Pins (every status pin and roadmap item on the site is computed from code, proofs and probe-backed issues)
        run: python3 -m foundation pins --check
      - name: Queue mirror shape (every docs/issues item maps to a valid GitHub issue, GH-MIRROR-1)
        run: python3 -m foundation ghmirror --check
      - name: Loops, glossary, kernel and write-back (the system reads its own loops; code with no write-back fails)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 -m foundation loops --verify
          python3 -m foundation glossary --check
          python3 -m foundation kernel --check
          python3 -m foundation directive --check
          python3 -m foundation closedloop --check
          python3 -m foundation openloops --check
          python3 -m foundation strays --check
          python3 -m foundation progress --check
          python3 -m foundation cfposture --check
          python3 -m foundation standingorder --check
          python3 -m foundation rules --check
          python3 -m foundation decisions --check
          python3 -m foundation goalscheck --check
          python3 -m foundation rules --probe no-qnfo-pages
          python3 -m foundation rules --probe no-secrets
          python3 -m foundation mergeaudit --check
          python3 -m foundation ciwatch --check
          python3 -m foundation serverside --check
          python3 -m foundation singleaccount --check
          python3 -m foundation owndb --check
          python3 -m foundation tenantcontrols --check
          python3 -m foundation rescore --check
          python3 -m foundation resilience --check
          python3 -m foundation clock --check
          python3 -m foundation userbackend --check
          python3 -m foundation standingorder --lint HANDOFF.md
          printf '%s' "$PR_BODY" | python3 -m foundation standingorder --lint-stdin
          python3 -m foundation selfimprove --check
          python3 -m foundation boundary --check
          python3 -m foundation market --check
          python3 -m foundation scout --check
          python3 -m foundation rnd --check
          python3 -m foundation research --check
          python3 -m foundation promote --check
          python3 -m foundation blindspots --check
          python3 -m foundation unknowns --check
          python3 -m foundation agentstd --check
          python3 -m foundation crosswalk --check
          python3 -m foundation agents --check
          python3 -m foundation system --check
          python3 -m foundation boundary --drill
          python3 -m foundation queue --check
          python3 -m foundation growth --check
          python3 -m foundation design --check
          python3 -m foundation design --lint
          python3 -m foundation insight --check
          python3 -m foundation uiux --check
          python3 -m foundation flows --check
          python3 -m foundation criticality --check
          python3 -m foundation ultrastability --check
          python3 -m foundation selfmodel --check
          python3 -m foundation cost --check
          python3 -m foundation loopowner --check
          python3 -m foundation pointclick --check
          python3 -m foundation claimcode --check
          python3 -m foundation directive --lint HANDOFF.md docs/lessons/*.md
          python3 -m foundation writeback check --base "origin/${{ github.base_ref || 'main' }}"
          python3 -m foundation needsyou --check
          python3 -m foundation orphans --check
          python3 -m foundation docs_audit --check
          python3 -m foundation publication --check
      - name: Core and instances (contract is current, kernel has no instance-specific values)
        run: |
          python3 -m foundation upstream contract --check
          python3 -m foundation upstream leaks
      - name: Agentic standards (register, surfaces, discovery lint; Worker conformance and contract tests)
        run: |
          python3 -m foundation standards --check
          (cd seed/worker && node --test --no-warnings test/*.test.js)
      - name: Foundation tests, new-system end-to-end (one job, no matrix)
        # COST-CHECKS-1: was ~70s serial and pushed runs past the 60s billing minute; 4 processes on the 4-vCPU runner
        run: |
          ls tests/foundation/test_*.py | xargs -n1 basename | sed 's/\.py$//' |             xargs -P4 -I{} sh -c 'python3 -m unittest discover -s tests/foundation -p "{}.py" > "/tmp/{}.log" 2>&1 || { echo "::error::{} failed"; cat "/tmp/{}.log"; exit 255; }'
  rest:
    if: ${{ vars.HALT != '1' && (github.event.pull_request.draft != true) }}  # HALT-1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Regenerate generated files locally (REGEN-1; the push is done by the fast job only)
        run: ./scripts/regen_generated.sh
      - name: License (patent track dropped 2026-11-11; pre-flight retired)
        run: |
          python3 scripts/check_license.py
          (cd scripts && python3 test_license.py)
      - name: No single route (loops and deploy paths)
        run: python3 scripts/check_routes.py
      - name: Guided set-up is plain-language and in sync (USER-PATH-1)
        run: python3 scripts/gen_userpath.py --check
      - name: Site worker modules parse (a syntax error blocks every deploy)
        run: for f in site/*.js; do node --check "$f" || exit 1; done
      - name: Site pins and gaps are tied to real issues and code (SITE-PINS-1)
        run: python3 scripts/build_site_roadmap.py --check
      - name: Words match code, CLAIMS-1, both directions
        run: python3 -m foundation claims --check
      - name: Proof surfaces own data only (PROOF-OWN-1)
        run: python3 -m foundation proofown --check
      - name: Tenant sync registry, TENANT-SYNC-1
        run: python3 -m foundation.tenantsync --check
      - name: Agent data is current
        run: python3 scripts/build_site_agentdata.py --check
      - name: Platform brief is current
        run: python3 scripts/platform_brief.py --check
      - name: Project memory is current
        run: python3 scripts/check_memory.py
      - name: Org repo registry (every repo declares a purpose)
        run: python3 scripts/check_org_repos.py
      - name: Business index (BIZ-3)
        run: python3 scripts/check_business_index.py
  checks:
    if: ${{ vars.HALT != '1' && always() && github.event.pull_request.draft != true }}  # HALT-1
    # LANE-FAST-1: the one required status. It stays named `checks`; the three jobs above run in parallel so wall time is the slowest one, not the sum.
    needs: [fast, foundation, rest]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every parallel job passed
        run: |
          [ "${{ needs.fast.result }}" = success ] && [ "${{ needs.foundation.result }}" = success ] && [ "${{ needs.rest.result }}" = success ] || { echo "::error::a parallel checks job did not pass"; exit 1; }
  lane:
    needs: [checks]
    if: ${{ vars.HALT != '1' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}  # HALT-1
    # LANE-FAST-1: merge the moment checks pass, in this run, instead of waiting for the workflow_run event and a second runner (measured 4-10 min).
    # Same gates as the lane workflow: scripts/lane.sh checks every status, the full-suite guard and the head commit. The `lane` job name is excluded
    # from its own pending count. A PR it cannot merge is left to the lane workflow, which stays as the fallback.
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
      actions: write
    concurrency:
      group: lane-fast
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Merge this PR now
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
          LANE_PAT: ${{ secrets.LANE_PAT }}
          LANE_APP_ID: ${{ secrets.LANE_APP_ID }}
          LANE_APP_PRIVATE_KEY: ${{ secrets.LANE_APP_PRIVATE_KEY }}
          LANE_ONLY_PR: ${{ github.event.pull_request.number }}
        run: bash scripts/lane.sh
