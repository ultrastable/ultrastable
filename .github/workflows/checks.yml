name: checks
# COST-ZERO-1: the steps that fail most often (measured over the last 25 failed runs: gaplint/demo tests, outreach tests, dashboard preview) run first, so a failing PR stops in seconds, not after the full run; 958 of 1218 minutes this month were failed runs
# budget: ~5 min per ready PR update (the folded-in workers/ tree lengthened the scan steps), cancel-in-progress
# trigger: PR gate; drafts skipped
# free-alternative: none needed; `scripts/lint_workflows.py` and the tests run in the cloud-hosted agent session first
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read  # COLLISION-1: reads the other open PRs' files
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    if: ${{ vars.HALT != '1' && (github.event.pull_request.draft != true) }}  # HALT-1
    runs-on: ubuntu-24.04
    timeout-minutes: 15  # measured 2026-11-27: 6 min 53 s on #2682 and cancelled at the 8-minute limit on #2664; a limit at the job's own duration fails by chance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Regenerate generated files for this run (REGEN-1)
        # self-heal: a count, ledger or dashboard that main moved under the PR is regenerated here, in the workspace, so the freshness checks below
        # read current files. PR-NO-GENERATED-1 (2026-11-27): the result is not pushed to the pull request any more. Pushing it put generator-owned
        # files on the branch, main regenerated the same files minutes later, the pull request conflicted, and each push cancelled the run in
        # progress, so no run finished (#2664, #2615, #2686). Main's post-merge job (regen-generated.yml) is the one writer of these files.
        run: ./scripts/regen_generated.sh
      - name: An executor PR must change executable behaviour (SUBSTANCE-1)
        # backstop for foundation/executor.py, which already refuses to open such a PR: a bumped number, a hash, an unused import or records only is not a change
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 -m foundation substance --check
          if [ -n "${BASE_SHA:-}" ]; then python3 -m foundation substance --gate --executor --range "${BASE_SHA}...HEAD"
          elif [ "${EVENT:-}" = "workflow_dispatch" ] && [[ "${REF_NAME:-}" == agent/* ]]; then  # the executor dispatches checks on its own agent/ branch
            git fetch -q origin main && PR_BODY="Executor run (dispatched checks)" python3 -m foundation substance --gate --executor --range "origin/main...HEAD"; fi
      - name: No clash with an older open PR or a reused migration number (COLLISION-1)
        # the knowledge-graph directive reached several sessions and five competing PRs clashed on a migration number, /api/graph and a check command
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 -m foundation collisions --check
          python3 -m foundation collisions --prs
      - name: Every path is classified (REPO-SHAPE-1)
        # state is kept apart from code; the size gate is SMALL-CHANGE-1 below, and an oversize branch splits with `foundation reposhape --split`
        run: python3 -m foundation reposhape --check
      - name: The change is small enough to verify and revert alone (SMALL-CHANGE-1)
        # ops PR 45 changed 3,194 files, 3,158 of them session scratch copies; a change that size cannot be reviewed, deployed or rolled back on its own
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "${BASE_SHA:-}" ]; then cd seed && python3 scripts/prsize.py --range "${BASE_SHA}...HEAD"; fi
      - name: tests-protected (TESTS-PROTECTED-1, ZHC-R11)
        # a change may move tests but not drop cases, drop assertions or add skips in the files it touches
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "${BASE_SHA:-}" ]; then python3 -m foundation testguard --range "${BASE_SHA}...HEAD"; fi
      - name: No new specification text on the public branch (DISCLOSE-1)
        run: python3 -m foundation disclosure --check
      - name: Workflow minute-budget lint (cheap, runs first)
        run: python3 scripts/lint_workflows.py
      - name: Instruction budget (INSTRUCTIONS-BUDGET-1)
        run: python3 scripts/instructions_budget.py --check
      - name: Public docs complete and in sync with the code (DOCS-SYNC-1)
        run: python3 scripts/check_readmes.py && python3 scripts/check_readmes.py --root seed
      - name: Workflow YAML parses
        run: python3 -c "import yaml,glob; [yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml')]"
      - name: Outreach engine tests
        working-directory: scripts
        run: python3 test_outreach.py
      - name: Dashboard preview is computed from the repository
        run: python3 scripts/build_dashboard.py --check
      - name: Product and demo tests, gaplint on this repo (no extra workflow; runs on PRs only)
        run: |
          (cd products/gaplint && python3 -m unittest discover -s tests)
          PYTHONPATH=products/gaplint python3 -m gaplint .
          node --test demos/test/*.test.mjs
          node --test test/cost-probe.test.mjs
          node --test test/plan-limits.test.mjs
          node --test test/record-deployments.test.mjs
          node --test --no-warnings tests/test_sweeper.js
          node --test --no-warnings dashboard/test/*.test.mjs
          bash scripts/site_tests.sh  # GATE-PARITY-1: runs site/*.test.mjs, the gate deploy-site runs before it deploys
      - name: No committed merge-conflict markers (MARKER-ROOT-1)
        run: python3 scripts/no_markers.py
      - name: Secret and key scan
        run: |
          if grep -rEIl --exclude-dir=.git -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' -e 'gh[pousr]_[A-Za-z0-9]{36,}' -e 'AKIA[0-9A-Z]{16}' -e 'sk-ant-[A-Za-z0-9_-]{20,}' .; then echo "secret-like content found"; exit 1; fi
      - name: No oversize files
        run: |
          big=$(find . -path ./.git -prune -o -type f -size +25M -print)
          [ -z "$big" ] || { echo "files over 25MB: $big"; exit 1; }
      - name: Repo verify
        run: |
      - name: Social guard tests
        working-directory: scripts
        run: python3 test_social.py
      - name: Demo video narration guard
        run: python3 scripts/video_build.py --check
      - name: LLM review tests
        working-directory: scripts
        run: python3 -m unittest test_llm_review
      - name: Seed tests
        working-directory: seed
        run: python3 -m unittest discover -s tests
      - name: Plugin tier (boundary lint, self-description drift, plugin and sender tests)
        working-directory: seed
        run: |
          python3 -m plugins check
          python3 -m plugins self --check
          python3 -m unittest discover -s plugins/tests -t .
          node --test plugins/email/worker/sender.test.mjs
  foundation:
    if: ${{ vars.HALT != '1' && (github.event.pull_request.draft != true) }}  # HALT-1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Regenerate generated files locally (REGEN-1; the push is done by the fast job only)
        run: ./scripts/regen_generated.sh
      - name: Doctrine check (positioning and code-is-the-only-memory, from doctrine/positioning.json)
        run: python3 -m foundation doctrine --check
      - name: Seed kernel is closed under bootstrap (BOOTPROOF-1)
        run: python3 -m foundation bootproof
      - name: Pins (every status pin and roadmap item on the site is computed from code, proofs and probe-backed issues)
        run: python3 -m foundation pins --check
      - name: Action pins (every `uses:` is a full commit SHA, shrink-only baseline, PINS-1 supply chain)
        run: python3 -m foundation.actionpins
      - name: Queue mirror shape (every docs/issues item maps to a valid GitHub issue, GH-MIRROR-1)
        run: python3 -m foundation ghmirror --check
      - name: Loops, glossary, kernel and write-back (the system reads its own loops; code with no write-back fails)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 -m foundation loops --verify
          python3 -m foundation glossary --check
          python3 -m foundation kernel --check
          python3 -m foundation directive --check
          python3 -m foundation closedloop --check
          python3 -m foundation openloops --check
          python3 -m foundation strays --check
          python3 -m foundation progress --check
          python3 -m foundation tenantpromo --check
          python3 -m foundation discover --check  # DISCOVER-1: every live tenant listed and cross-linked; the seed serves its manifest, footer and heartbeat
          python3 -m foundation coherence --check  # COHERENCE-1: no instruction surface contradicts the closed-loop axiom; every rule names code and reaches the seed
          python3 -m foundation cleanroom --check  # CLEANROOM-1: the clean-room bootstrap is wired and scheduled
          python3 -m foundation fullstack --check  # FULLSTACK-1: repository, back end and public front end for every system
          python3 -m foundation fleetcontract --check  # FLEET-CONTRACT-1: every live system carries the one contract module; one surface list
          python3 -m foundation tenantstd --check  # TENANT-STANDARD-1: every tenant vendors the standard's base files; one scaffold writes every standard file
          python3 -m foundation fleetmap --check  # FLEET-MAP-1: every repository of the org is one row; every copy names its source and its sync
          python3 -m foundation surfaces --check  # SYSTEM-MANIFEST-1: the kernel manifest is valid and every surface equals what it renders
          python3 -m foundation livelinks --check  # LIVE-LINKS-1: the README names where the platform and every system run
          python3 -m foundation managers --check  # MANAGERS-1: every role is a loop with code, a clock, a probe and a settler; every loop has a manager; the seed carries every manager
          python3 -m foundation rulerefs --check  # RULE-REFS-1: every path, command, test, workflow and route the rule files name resolves
          python3 -m foundation datagraph --check
          python3 -m foundation openstd --check  # OPEN-STANDARDS-1: registered open standards; no new bespoke format
          python3 -m foundation coldstart --check  # COLDSTART-1: the seed carries every capability a system owes from birth; named commands resolve; agent files agree
          python3 -m foundation cfposture --check
          python3 -m foundation standingorder --check
          python3 -m foundation rules --check
          python3 -m foundation decisions --check
          python3 -m foundation goalscheck --check
          python3 -m foundation rules --probe no-qnfo-pages
          python3 -m foundation rules --probe no-secrets
          python3 -m foundation mergeaudit --check
          python3 -m foundation ciwatch --check
          python3 -m foundation serverside --check
          python3 -m foundation singleaccount --check
          python3 -m foundation owndb --check
          python3 -m foundation tenantcontrols --check
          python3 -m foundation rescore --check
          python3 -m foundation resilience --check
          python3 -m foundation clock --check
          python3 -m foundation userbackend --check
          python3 -m foundation standingorder --lint HANDOFF.md
          printf '%s' "$PR_BODY" | python3 -m foundation standingorder --lint-stdin
          python3 -m foundation selfimprove --check
          python3 -m foundation boundary --check
          python3 -m foundation market --check
          python3 -m foundation scout --check
          python3 -m foundation rnd --check
          python3 -m foundation research --check
          python3 -m foundation promote --check
          python3 -m foundation blindspots --check
          python3 -m foundation unknowns --check
          python3 -m foundation agentstd --check
          python3 -m foundation crosswalk --check
          python3 -m foundation agents --check
          python3 -m foundation system --check
          python3 -m foundation boundary --drill
          python3 -m foundation queue --check
          python3 -m foundation growth --check
          python3 -m foundation design --check
          python3 -m foundation design --lint
          python3 -m foundation insight --check
          python3 -m foundation uiux --check
          python3 -m foundation flows --check
          python3 -m foundation criticality --check
          python3 -m foundation ultrastability --check
          python3 -m foundation ashbymap --check
          python3 -m foundation specgate --check  # SPEC-GATE-1: new items carry done check, prediction, out of scope, live proof
          python3 -m foundation lessons --check  # LESSONS-1: every lesson enforced in code or carried by an open item
          python3 -m foundation verify --check
          python3 -m foundation selfmodel --check
          python3 -m foundation cost --check
          python3 -m foundation loopowner --check
          python3 -m foundation tenantrepos --check  # TENANT-REPO-1: tenant code lives in its own repository
          python3 -m foundation repostd --check  # REPO-STANDARD-1: one repository standard; the Worker and the kit carry the same one
          python3 -m foundation pointclick --check
          python3 -m foundation claimcode --check
          python3 -m foundation driftguard --check  # DRIFT-GUARD-1: every incident class has a check, detector and failure mode
          python3 -m foundation driftguard --crons  # DRIFT-GUARD-1: crons fit the account's plan limit; every tenant clock has a pulse route
          python3 -m foundation driftguard --handoff-lint  # DRIFT-GUARD-1: a deploy is verified by reading what it deployed, not the tick's /health
          python3 -m foundation silentfail --check  # SILENT-FAIL-1: Worker bundle, duplicate modules, silent-failure classes
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr_body.txt" && python3 -m foundation silentfail --cite "$RUNNER_TEMP/pr_body.txt"  # a done claim cites a live reading
          python3 -m foundation directive --lint HANDOFF.md docs/lessons/*.md
          python3 -m foundation writeback check --base "origin/${{ github.base_ref || 'main' }}"
          python3 -m foundation needsyou --check
          python3 -m foundation orphans --check
          python3 -m foundation docs_audit --check
          python3 -m foundation publication --check
      - name: Core and instances (contract is current, kernel has no instance-specific values)
        run: |
          python3 -m foundation upstream contract --check
          python3 -m foundation upstream leaks
      - name: Standards (register, surfaces, discovery lint, config schemas, catalog and SBOM; Worker conformance and contract tests)
        run: |
          python3 -m foundation standards --check
          python3 -m foundation configschema --check  # CONFIG-SCHEMA-1: every config validates against its JSON Schema contract
          python3 -m foundation stdgen --check        # STANDARDS-1: Backstage catalog and CycloneDX SBOM match the registers
          (cd seed/worker && node --test --no-warnings test/*.test.js)
  tests-a:
    if: ${{ vars.HALT != '1' && (github.event.pull_request.draft != true) }}  # HALT-1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Regenerate generated files locally (REGEN-1; the push is done by the fast job only)
        run: ./scripts/regen_generated.sh
      - name: Foundation tests, half 1 of 2 (LANE-FAST-1)
        # COST-CHECKS-1: was ~70s serial and pushed runs past the 60s billing minute; 4 processes on the 4-vCPU runner
        run: |
          ls tests/foundation/test_*.py | awk 'NR%2==1' | xargs -n1 basename | sed 's/\.py$//' |             xargs -P4 -I{} sh -c 'python3 -m unittest discover -s tests/foundation -p "{}.py" > "/tmp/{}.log" 2>&1 || { echo "::error::{} failed"; cat "/tmp/{}.log"; exit 255; }'
  tests-b:
    if: ${{ vars.HALT != '1' && (github.event.pull_request.draft != true) }}  # HALT-1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Regenerate generated files locally (REGEN-1; the push is done by the fast job only)
        run: ./scripts/regen_generated.sh
      - name: Foundation tests, half 2 of 2 (LANE-FAST-1)
        # COST-CHECKS-1: was ~70s serial and pushed runs past the 60s billing minute; 4 processes on the 4-vCPU runner
        run: |
          ls tests/foundation/test_*.py | awk 'NR%2==0' | xargs -n1 basename | sed 's/\.py$//' |             xargs -P4 -I{} sh -c 'python3 -m unittest discover -s tests/foundation -p "{}.py" > "/tmp/{}.log" 2>&1 || { echo "::error::{} failed"; cat "/tmp/{}.log"; exit 255; }'
  rest:
    if: ${{ vars.HALT != '1' && (github.event.pull_request.draft != true) }}  # HALT-1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Regenerate generated files locally (REGEN-1; the push is done by the fast job only)
        run: ./scripts/regen_generated.sh
      - name: License (patent track dropped 2026-11-11; pre-flight retired)
        run: |
          python3 scripts/check_license.py
          (cd scripts && python3 test_license.py)
      - name: No single route (loops and deploy paths)
        run: python3 scripts/check_routes.py
      - name: Guided set-up is plain-language and in sync (USER-PATH-1)
        run: python3 scripts/gen_userpath.py --check
      - name: Site worker modules parse (a syntax error blocks every deploy)
        run: for f in site/*.js; do node --check "$f" || exit 1; done
      - name: Site pins and gaps are tied to real issues and code (SITE-PINS-1)
        run: python3 scripts/build_site_roadmap.py --check
      - name: Words match code, CLAIMS-1, both directions
        run: python3 -m foundation claims --check
      - name: The seed carries its own definition and passes its own tests, as a new system would (SYSTEM-SPEC-1)
        # The platform edits seed/ on every change, yet never ran the seed's Python suite; a new system was the first to find a break.
        run: cd seed && python3 scripts/system.py --check && python3 -m unittest discover tests
      - name: Proof surfaces own data only (PROOF-OWN-1)
        run: python3 -m foundation proofown --check
      - name: Tenant sync registry, TENANT-SYNC-1
        run: python3 -m foundation.tenantsync --check
      - name: Tenant admission, ADMIT-1 (one tenant-repos row; every registry derived)
        run: python3 -m foundation admit --check
      - name: Agent data is current
        run: python3 scripts/build_site_agentdata.py --check
      - name: Platform brief is current
        run: python3 scripts/platform_brief.py --check
      - name: Project memory is current
        run: python3 scripts/check_memory.py
      - name: Org repo registry (every repo declares a purpose)
        run: python3 scripts/check_org_repos.py
      - name: Business index (BIZ-3)
        run: python3 scripts/check_business_index.py
  checks:
    if: ${{ vars.HALT != '1' && always() && github.event.pull_request.draft != true }}  # HALT-1
    # LANE-FAST-1: the one required status. It stays named `checks`; the three jobs above run in parallel so wall time is the slowest one, not the sum.
    needs: [fast, foundation, tests-a, tests-b, rest]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every parallel job passed
        run: |
          [ "${{ needs.fast.result }}" = success ] && [ "${{ needs.foundation.result }}" = success ] && [ "${{ needs.rest.result }}" = success ] && [ "${{ needs.tests-a.result }}" = success ] && [ "${{ needs.tests-b.result }}" = success ] || { echo "::error::a parallel checks job did not pass"; exit 1; }
  lane:
    needs: [checks]
    if: ${{ vars.HALT != '1' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}  # HALT-1
    # LANE-FAST-1: merge the moment checks pass, in this run, instead of waiting for the workflow_run event and a second runner (measured 4-10 min).
    # Same gates as the lane workflow: scripts/lane.sh checks every status, the full-suite guard and the head commit. The `lane` job name is excluded
    # from its own pending count. A PR it cannot merge is left to the lane workflow, which stays as the fallback.
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
      actions: write
    concurrency:
      group: lane-fast
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - name: Merge this PR now
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
          LANE_PAT: ${{ secrets.LANE_PAT }}
          LANE_APP_ID: ${{ secrets.LANE_APP_ID }}
          LANE_APP_PRIVATE_KEY: ${{ secrets.LANE_APP_PRIVATE_KEY }}
          LANE_ONLY_PR: ${{ github.event.pull_request.number }}
        run: bash scripts/lane.sh
