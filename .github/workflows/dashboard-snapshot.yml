name: dashboard-snapshot
# Builds dashboard/snapshot.json from the repo (funding and outreach, IP, trust, owner cards, bootstrap gaps), commits it,
# and posts it to the owner dashboard when the DASHBOARD_URL and FLEET_TOKEN secrets exist (binding names only).
on:
  workflow_run:
    workflows: [outreach]
    types: [completed]
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dashboard-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Build snapshot
        run: python3 scripts/dashboard_snapshot.py
      - name: Post to dashboard
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          FLEET_TOKEN: ${{ secrets.FLEET_TOKEN }}
        run: |
          if [ -z "$DASHBOARD_URL" ] || [ -z "$FLEET_TOKEN" ]; then echo "::notice::DASHBOARD_URL or FLEET_TOKEN not set: snapshot committed only (docs/BOOTSTRAP-GAPS.md BG-33)"; exit 0; fi
          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST "$DASHBOARD_URL/api/fleet/snapshot" -H "authorization: Bearer $FLEET_TOKEN" -H 'content-type: application/json' --data-binary @dashboard/snapshot.json)
          cat /tmp/resp.json; echo
          [ "$code" = "200" ] || { echo "::error::dashboard answered HTTP $code"; exit 1; }
      - name: Record snapshot
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git add dashboard/snapshot.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name "ultrastable-dashboard"; git config user.email "dashboard@ultrastable.io"
          git commit -m "dashboard: refresh snapshot"
          git push origin HEAD:main || { echo "::error::snapshot push failed (BG-33)"; exit 1; }
