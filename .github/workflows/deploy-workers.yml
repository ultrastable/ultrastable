name: deploy-workers
# DEPLOY-ALL-1: merge -> deploy of the tick and dashboard Workers -> verify live code equals this commit's build.
# budget: ~2 min per run, only when worker sources change
# trigger: push to main on the listed paths, dispatch by the lane after a merge (GITHUB_TOKEN merges fire no push events), manual dispatch; never faster than the merge rate
# free-alternative: run `node deploy/deploy-workers.mjs` from a session with a Cloudflare token
# Verify-only mode (`verify` input, manual dispatch) fails when live code differs from this commit. The standing drift reading is `python3 -m foundation deploydrift` (DEPLOY-DRIFT-1).
on:
  push:
    branches: [main]
    paths: ["seed/worker/**", "deploy/apply-d1-migrations.mjs", "seed/analytics/**", "seed/bootstrap/questions.json", "seed/autonomy/**", "dashboard/**", "doctrine/topology.json", "deploy/deploy-workers.mjs", "foundation/topology.py", ".github/workflows/deploy-workers.yml"]
  workflow_dispatch:
    inputs:
      verify:
        description: "verify only (no deploy)"
        required: false
        default: "false"
permissions:
  id-token: write  # MAIN-WRITER-1: tools/push_main.py presents the run's OIDC token
  contents: write
concurrency: {group: deploy-workers, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    if: ${{ vars.HALT != '1' && (vars.DEPLOY_SITE_ENABLED == 'true') }}  # HALT-1
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: {node-version: 24}
      - name: Worker tests
        run: node --test --no-warnings seed/worker/test/*.test.js
      - name: Require credentials
        run: '[ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Cloudflare secrets not set"; exit 1; }'
      - name: Apply D1 migrations (ledgered, idempotent)
        if: ${{ inputs.verify != 'true' }}
        run: node deploy/apply-d1-migrations.mjs
      - name: Deploy and verify live code equals this commit
        run: node deploy/deploy-workers.mjs ${{ inputs.verify == 'true' && '--verify' || '' }}
      - name: Live probe (tick completes every step, k_eff measured, sweeper ran)
        run: node deploy/probe-live.mjs ${{ inputs.verify == 'true' && '' || '--wait-min 12' }}
      - name: Bind the tick Worker's credentials (SELF-SUSTAIN-1)
        if: ${{ inputs.verify != 'true' }}
        env:
          GITHUB_REPOS: ultrastable/ultrastable
        run: node deploy/bind-worker-secrets.mjs
      - name: Record the deploy
        if: ${{ inputs.verify != 'true' }}
        run: |
          git config user.name "ultrastable-ops"; git config user.email "actions@users.noreply.github.com"
          python3 -m foundation claims --fix --apply
          git add ops/deploys.jsonl ops/bindings.jsonl README.md platform/adapters/README.md site/claims-data.js; bash tools/record_main.sh "deploy-workers: record live-verified deploy"
