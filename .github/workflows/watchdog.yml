name: watchdog
# budget: ~2 min per run (the say-do check runs every stated --check, about a minute), one scheduled run a day (~30 min per month), plus one per failed lane, deploy-site or executor run (bounded by the concurrency group)
# trigger: daily (never faster), plus a failed lane, deploy-site or executor run, so any failure is another independent wake; the Cloudflare tick (free) also dispatches this workflow whenever it is older than 12 h, which is the frequent path (watchdog-of-watchdogs)
# free-alternative: the Cloudflare cron worker already runs the tick watchdog loop (seed/worker/src/watchdog.js) at zero Actions minutes; this workflow is the credential-free second route
# Probes every clock (doctrine/clocks.json and every scheduled workflow), restarts the stopped ones (workflow dispatch, or POST /pulse/watch on each Cloudflare account),
# files Q-STALL-* when a restart did not take, and records ops/resilience.jsonl, which feeds the essential variable stalled_clocks.
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_run:
    workflows: [lane, deploy-site, executor]
    types: [completed]
  workflow_dispatch: {}
permissions:
  id-token: write  # MAIN-WRITER-1: tools/push_main.py presents the run's OIDC token
  contents: write
  actions: write
  pull-requests: write  # MAINWRITER-FALLBACK-1
concurrency:
  group: watchdog
  cancel-in-progress: false
jobs:
  watchdog:
    if: ${{ vars.HALT != '1' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure') }}  # HALT-1; a finished run wakes the watchdog only when it failed (a busy main would otherwise wake it dozens of times a day)
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Probe, restart, escalate
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 -m foundation resilience --run --apply --changed-file "$RUNNER_TEMP/changed"
      - name: Credential and registration expiry (TOKEN-EXPIRY-1)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LANE_PAT: ${{ secrets.LANE_PAT }}
        run: python3 -m foundation credwatch --run --apply --changed-file "$RUNNER_TEMP/changed"
      - name: Close owner gates whose evidence is in (GATE-SETTLE-1)
        env:
          LANE_PAT: ${{ secrets.LANE_PAT }}
          LANE_APP_ID: ${{ secrets.LANE_APP_ID }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
        run: python3 -m foundation needsyou --settle --changed-file "$RUNNER_TEMP/changed"
      - name: Walk every route for every owner ask and diff regressed integrations (PATHFINDER-1)
        run: python3 -m foundation pathfinder --resolve-all
      - name: Projected unattended runway against the one-year target (RUNWAY-1)
        run: python3 -m foundation runway --run --apply --changed-file "$RUNNER_TEMP/changed"
      - name: Retirements the executor met become catalog changes (MODEL-HEAL-1, no Workers AI credential needed)
        run: python3 -m foundation modelwatch --observed --apply
      - name: A year of faults injected into the real recovery code (YEAR-SIM-1)
        run: python3 -m foundation yearsim --run --apply --changed-file "$RUNNER_TEMP/changed"
      - name: Say-do, every stated rule and claim against the code (SAY-DO-1)
        run: python3 -m foundation saydo --run --apply --changed-file "$RUNNER_TEMP/changed"
      - name: Ultrastability tick (a stall is a second-order event)
        run: python3 -m foundation ultrastability --tick --apply
      - name: Record
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
        # only when a restart, an escalation or the set of stalled clocks changed (or once a day); [skip ci] keeps this commit from waking deploy-site, whose completion would wake this workflow again
        run: |
          [ "$(cat "$RUNNER_TEMP/changed")" = "1" ] || { echo "nothing changed; ledger not committed"; exit 0; }
          git config user.name "ultrastable-watchdog"; git config user.email "actions@users.noreply.github.com"
          git add ops/resilience.jsonl ops/ultrastability.jsonl ops/credwatch.json ops/runway.json ops/paths/attempts.jsonl docs/issues NEEDS-YOU.md foundation/data/needs-you.json doctrine/point-and-click.json ops/yearsim.json ops/yearsim.jsonl ops/saydo.json ops/saydo.jsonl site/yearsim-data.js site/saydo-data.js site/ultrastability-data.js doctrine/models.json doctrine/priorities.json doctrine/clocks.json doctrine/spinoff.json
          python3 scripts/land_data.py "watchdog: clock probe (RESILIENCE-1)" ops/resilience.jsonl ops/ultrastability.jsonl ops/credwatch.json ops/runway.json ops/paths/attempts.jsonl docs/issues NEEDS-YOU.md foundation/data/needs-you.json doctrine/point-and-click.json  # MAINWRITER-FALLBACK-1: main writer first, then a pull request ops/yearsim.json ops/yearsim.jsonl ops/saydo.json ops/saydo.jsonl site/yearsim-data.js site/saydo-data.js site/ultrastability-data.js doctrine/models.json doctrine/priorities.json doctrine/clocks.json doctrine/spinoff.json
