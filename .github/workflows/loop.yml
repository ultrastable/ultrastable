name: loop
# The self-bootstrap loop on GitHub's scheduler: the credential-free host. Its token is minted by GitHub for each run; no person mints one.
# budget: ~1 min x 30 per month while another host is alive (the gate exits before any setup); ~2 min for a run that takes over
# trigger: daily failover gate and dispatch; it runs the loops only when no host has written evidence for 12 h (instances/ultrastable/loops.json)
# free-alternative: Cloudflare cron worker ultrastable-tick (every 10 minutes) or the cloud-hosted Claude routine (deploy/loops/claude-routine.md)
# Runs `python3 -m foundation launch`: every loop once, evidence committed to branch loop-evidence. Outreach stays dry-run.
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: loop
  cancel-in-progress: true
jobs:
  loop:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - run: python3 scripts/actions_guard.py loop
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Failover gate (is another host alive?)
        id: gate
        run: ULTRASTABLE_HOST=github-actions python3 -m foundation launch --failover --decide
      - uses: actions/setup-node@v6
        if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        with:
          node-version: 22
      - if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: pip install pyyaml
      - name: Run the loops (a dispatch always runs; the schedule runs only on takeover)
        if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then flag=""; else flag="--failover"; fi
          ULTRASTABLE_HOST=github-actions python3 -m foundation launch $flag --commit --push
