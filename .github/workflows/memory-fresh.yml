name: memory-fresh
on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  memory-fresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: docs/PROJECT-MEMORY.md is current
        run: python3 scripts/check_memory.py
