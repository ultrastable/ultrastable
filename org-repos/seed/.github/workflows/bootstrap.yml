name: bootstrap
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: python3 -m unittest discover tests
      - run: python3 bootstrap/bootstrap.py --dry-run
      - run: cd worker && npm test
  apply:
    needs: test
    runs-on: ubuntu-latest
    # Provisions only when the owner has set the secrets; otherwise the dry run above already opened gate cards.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: python3 bootstrap/bootstrap.py --apply
      - name: Commit the org record
        run: |
          git config user.name "ultrastable-bootstrap"
          git config user.email "bootstrap@users.noreply.github.com"
          git add org && git diff --cached --quiet || git commit -m "Record boot: org/ charter, roles, backlog, gate cards" && git push
