# The owner cockpit as static Workers assets. Build, then deploy (needs the Cloudflare credentials; BG-35). Never deploy it without Cloudflare Access in front:
# it shows internal records.
#   python3 -m foundation cockpit --out dashboard/cockpit/dist
#   npx wrangler deploy --config dashboard/cockpit/wrangler.toml
name = "ultrastable-cockpit"
compatibility_date = "2026-11-01"
workers_dev = false

[assets]
directory = "./dist"
