name = "ultrastable-site"
main = "worker.js"
compatibility_date = "2026-11-04"

routes = [
  { pattern = "ultrastable.io", custom_domain = true },
  { pattern = "www.ultrastable.io", custom_domain = true },
  { pattern = "ultrastable.app", custom_domain = true },
  { pattern = "ultrastable.net", custom_domain = true },
  { pattern = "www.ultrastable.app", custom_domain = true },
  { pattern = "www.ultrastable.net", custom_domain = true },
  { pattern = "www.ultrastable.app/*", zone_name = "ultrastable.app" }  # UPTIME-1: beats the wildcard *.ultrastable.app/* route of the spinoffs worker, which answered 404
]

[observability]
enabled = true
head_sampling_rate = 1

# ANALYTICS-1: first-party analytics share the ops database (seed/analytics/schema.sql).
[[d1_databases]]
binding = "DB"
database_name = "ultrastable-ops"
database_id = "5cd83b52-864a-4510-b062-fc0d9402d06c"

[[kv_namespaces]]
binding = "ASSETS"
id = "eade26c7862a4f4cad4827baeb29e04e"
